name: Build & push backend image

# Builds the Galaxy backend container image on every release tag push (and on
# manual dispatch). Pushes to ECR + GHCR with three tags:
#   - sha-<commit>      pinned forever, used by deploys
#   - main-latest       moving pointer, used by smoke "give me current"
#   - release-x.y.z    only when the push is a release-x.y.z tag
#
# Multi-arch strategy: two native-runner jobs (amd64 + arm64) build and
# smoke-test their platform image independently, push per-platform tags, then
# a merge-manifest job combines them into a single multi-arch manifest. Native
# runners avoid QEMU and keep the smoke tests faithful (no emulation slowdown).
#
# Past-incident guardrails (see docs/20260514_CICD_REBUILD_PLAN.md §6.3):
#   - L1: image tagged with git sha (never bare `latest`); /image-build-info baked in
#   - L2: import-smoke at build time so missing deps fail loudly
#   - L4: grep image for /home/ literals → fail build
#   - L5: Nextflow version pinned via ARG NF_VERSION (Dockerfile)
#   - L18: /opt/aws-cli/bin/aws verified
#   - L22: .dockerignore presence asserted

on:
  push:
    tags:
      - 'release-v**'
      - 'beta-v**'
      - 'dev-v**'
  workflow_dispatch: {}

permissions:
  id-token: write    # OIDC for assume-role
  contents: read
  packages: write    # push to GHCR for on-prem distribution

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate/dev-backend
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush
  GHCR_IMAGE: ghcr.io/biomate-ai/biomate-backend

jobs:
  # ── Per-platform build + smoke + push ────────────────────────────────────────
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || startsWith(github.ref, 'refs/tags/beta-v') && 'staging' || 'development' }}
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      release_tag: ${{ steps.tags.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-flight — .dockerignore present (L22)
        run: |
          test -f backend/.dockerignore || { echo "::error::backend/.dockerignore missing"; exit 1; }
          grep -qE '(^|/)\.venv' backend/.dockerignore || { echo "::error::.venv not excluded in backend/.dockerignore"; exit 1; }
          grep -qE 'database/.*\.(sqlite|db)' backend/.dockerignore || { echo "::error::database/*.sqlite not excluded in backend/.dockerignore"; exit 1; }
          echo "OK"

      - name: Pre-flight — Python 3.9 compat guard (nextflow_executor)
        # Galaxy container ships Python 3.9. nextflow_executor.py uses PEP 604
        # `X | Y` union syntax and requires `from __future__ import annotations`.
        # The line has been stripped 4+ times by parallel-session sweep commits.
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest backend/tests/test_nextflow_executor_python39_compat.py -v

      - name: Compute build tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH_TAG="$(echo "$BRANCH" | tr '/' '-')-latest"
            echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "branch_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/release-* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (platform-native, load locally for smoke)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-${{ matrix.suffix }},mode=max

      - name: Smoke — /image-build-info present (L1)
        run: |
          docker run --rm --entrypoint cat \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }} \
            /image-build-info

      - name: Smoke — /opt/aws-cli/bin/aws works (L18)
        run: |
          docker run --rm --entrypoint /opt/aws-cli/bin/aws \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }} \
            --version

      - name: Smoke — Nextflow version matches ARG NF_VERSION (L5)
        run: |
          docker run --rm --entrypoint /usr/local/bin/nextflow \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }} \
            -version

      - name: Smoke — Python critical imports (L2)
        run: |
          docker run --rm --entrypoint python \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }} \
            -c "import boto3, redis, psycopg2, requests, yaml, sqlalchemy, alembic; print('imports OK')"

      - name: Lint — no /home/ literals baked into image (L4)
        run: |
          ALLOWED='/home/(appuser|ubuntu|runner|nate|playwright|sbx_user|jovyan|john|documentation)/'
          HITS=$(docker run --rm --entrypoint sh \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }} \
              -c 'grep -rIE "/home/[a-z]+/" /app \
                    --include="*.py" --include="*.yml" --include="*.yaml" --include="*.conf" --include="*.cfg" --include="*.json" \
                    --exclude-dir=site-packages --exclude-dir=.venv --exclude-dir=node_modules \
                    2>/dev/null | grep -v "^Binary"' \
                  | grep -vE "^/app/(lib/galaxy|test)/" \
                  | grep -vE "$ALLOWED" \
                  | head -5 || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Image contains developer-machine /home/<user>/ literals — refusing to push. See L4 in CI/CD plan."
            echo "$HITS"
            exit 1
          fi
          echo "OK"

      - name: Push per-platform sha tag
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }}

  # ── Merge per-platform images into a single multi-arch manifest ───────────────
  merge-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || startsWith(github.ref, 'refs/tags/beta-v') && 'staging' || 'development' }}

    steps:
      - name: Compute tags (same formula as build job)
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "branch_tag=$(echo "$BRANCH" | tr '/' '-')-latest" >> "$GITHUB_OUTPUT"
          else
            echo "branch_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/release-* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (for imagetools)
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch sha manifest (ECR)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"

      - name: Tag + push branch-scoped moving tag (ECR)
        if: steps.tags.outputs.branch_tag != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.branch_tag }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"

      - name: Tag + push release tag (ECR)
        if: steps.tags.outputs.release_tag != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.release_tag }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"

      - name: Push GHCR multi-arch manifest (on-prem, release + branch)
        # Push to GHCR on every branch build so on-prem ARM64 instances can pull
        # branch-tagged images without needing ECR credentials.
        # `:latest` is only updated on release-v* tags (production release gate).
        run: |
          # Re-push per-platform images to GHCR so imagetools can reference them
          docker pull "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64"
          docker pull "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"
          docker tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
                     "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-amd64"
          docker tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64" \
                     "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-arm64"
          docker push "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-amd64"
          docker push "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-arm64"
          # Always push sha-tagged multi-arch manifest
          docker buildx imagetools create \
            --tag "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}" \
            "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-arm64"
          # Push branch-scoped moving tag to GHCR when building from a branch
          if [[ -n "${{ steps.tags.outputs.branch_tag }}" ]]; then
            docker buildx imagetools create \
              --tag "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.branch_tag }}" \
              "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
              "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-arm64"
          fi
          # Only update :latest on release-v* tags (production gate)
          if [[ -n "${{ steps.tags.outputs.release_tag }}" ]]; then
            docker buildx imagetools create \
              --tag "${{ env.GHCR_IMAGE }}:latest" \
              --tag "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.release_tag }}" \
              "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
              "${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.sha_tag }}-arm64"
          fi

      - name: Summary
        run: |
          {
            echo "## Backend image build (multi-arch: amd64 + arm64)"
            echo "- sha tag: \`${{ steps.tags.outputs.sha_tag }}\`"
            [[ -n "${{ steps.tags.outputs.branch_tag }}" ]]  && echo "- branch tag: \`${{ steps.tags.outputs.branch_tag }}\`" || true
            [[ -n "${{ steps.tags.outputs.branch_tag }}" ]]  && echo "- GHCR branch: \`${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.branch_tag }}\`" || true
            [[ -n "${{ steps.tags.outputs.release_tag }}" ]] && echo "- release tag: \`${{ steps.tags.outputs.release_tag }}\`" || true
            echo "- ECR: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}\`"
            [[ -n "${{ steps.tags.outputs.release_tag }}" ]] && echo "- GHCR: \`${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.release_tag }}\`" || true
          } >> "$GITHUB_STEP_SUMMARY"
