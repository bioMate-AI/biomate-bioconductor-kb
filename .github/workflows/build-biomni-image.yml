name: Build biomni image (reusable)

# Reusable build+verify+push for the biomni-* Batch containers.
#
# Strategy: two independent native-runner jobs, no manifest merge.
#   amd64: ubuntu-latest → :x86 tag   (stable AWS Batch path, always runs)
#   arm64: ubuntu-24.04-arm → :arm64 tag (on-prem Graviton, gated by build_arm64 input)
#
# Separate tags keep amd64 and arm64 fully isolated. arm64 instability never
# touches the production Batch path. Merge to multi-arch :latest later once arm64 is stable.
#
# Both builds use host `docker build` so the host's ECR credentials are inherited
# by the daemon that pulls the private FROM base (no buildx isolation issue).
# Smoke tests run natively on each arch — no QEMU, no C-extension segfaults.
#
# Prerequisite for arm64: biomate/nextflow-base:arm64 must exist in ECR.
# Until then, set build_arm64: false in callers.

on:
  workflow_call:
    inputs:
      image_repo:
        description: "ECR repo, e.g. biomate/biomni-admet"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
      smoke_script:
        description: "Path to a python smoke script run inside the image"
        required: true
        type: string
      emit_lockfile:
        description: "Print `pip freeze` (to derive/update a lockfile)"
        required: false
        default: false
        type: boolean
      smoke_cpus:
        description: "Limit the smoke container to N cpus (reproduce a 1-vCPU Batch box); empty = unlimited"
        required: false
        default: ""
        type: string
      build_arm64:
        description: "Build a native arm64 image in addition to amd64. Requires the FROM base to have an arm64 manifest."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush

jobs:
  # ── amd64 build (always runs) ───────────────────────────────────────────────
  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: tags
        run: echo "sha_tag=x86-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image with host docker (authed for private ECR base)
        # Host `docker build` — NOT a buildx docker-container builder, which runs
        # isolated buildkit that doesn't inherit the host ECR creds → 403 on the
        # private FROM base. Runner is x86 → native amd64 build.
        run: |
          docker build \
            --platform linux/amd64 \
            -f "${{ inputs.dockerfile }}" \
            -t "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            .

      - name: Smoke test (inside the built image; gates the push)
        run: |
          test -f "${{ inputs.smoke_script }}" || { echo "::error::smoke script not found: ${{ inputs.smoke_script }}"; exit 1; }
          CPUFLAG=""
          if [ -n "${{ inputs.smoke_cpus }}" ]; then
            N="${{ inputs.smoke_cpus }}"
            CPUFLAG="--cpus=${N} --cpuset-cpus=0-$((N-1))"
            echo "smoke pinned to ${N} cpu(s): $CPUFLAG"
          fi
          docker run --rm $CPUFLAG \
            -v "${{ github.workspace }}/${{ inputs.smoke_script }}:/smoke.py:ro" \
            "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            python3 /smoke.py

      - name: Dump full dependency freeze (lockfile source)
        if: ${{ inputs.emit_lockfile }}
        run: |
          echo "=====PIPFREEZE_BEGIN====="
          docker run --rm "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            python3 -m pip freeze --all | LC_ALL=C sort -f
          echo "=====PIPFREEZE_END====="

      - name: Push amd64 tags
        run: |
          docker tag \
            "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            "${ECR_REGISTRY}/${{ inputs.image_repo }}:x86"
          docker push "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}"
          docker push "${ECR_REGISTRY}/${{ inputs.image_repo }}:x86"

      - name: Summary
        if: always()
        run: |
          echo "### ${{ inputs.image_repo }} (amd64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ inputs.image_repo }}:x86\` (+ \`${{ steps.tags.outputs.sha_tag }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke: \`${{ inputs.smoke_script }}\` (native x86, run inside image before push)" >> "$GITHUB_STEP_SUMMARY"

  # ── arm64 build (optional, gated by build_arm64 input) ─────────────────────
  build-arm64:
    if: ${{ inputs.build_arm64 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: tags
        run: echo "sha_tag=arm64-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image with host docker (native arm64 runner)
        # Native arm64 runner — no QEMU. Host `docker build` inherits ECR creds
        # from the daemon (same approach as the amd64 job above).
        # BASE_TAG=arm64: tells the Dockerfile to FROM the arm64 base image.
        # TARGETARCH=arm64: controls arch-specific install paths inside the build.
        run: |
          docker build \
            --platform linux/arm64 \
            --build-arg TARGETARCH=arm64 \
            --build-arg BASE_TAG=arm64 \
            -f "${{ inputs.dockerfile }}" \
            -t "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            .

      - name: Smoke test (native arm64 — no emulation)
        run: |
          test -f "${{ inputs.smoke_script }}" || { echo "::error::smoke script not found: ${{ inputs.smoke_script }}"; exit 1; }
          CPUFLAG=""
          if [ -n "${{ inputs.smoke_cpus }}" ]; then
            N="${{ inputs.smoke_cpus }}"
            CPUFLAG="--cpus=${N} --cpuset-cpus=0-$((N-1))"
            echo "smoke pinned to ${N} cpu(s): $CPUFLAG"
          fi
          docker run --rm $CPUFLAG \
            -v "${{ github.workspace }}/${{ inputs.smoke_script }}:/smoke.py:ro" \
            "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            python3 /smoke.py

      - name: Push arm64 tags
        run: |
          docker tag \
            "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}" \
            "${ECR_REGISTRY}/${{ inputs.image_repo }}:arm64"
          docker push "${ECR_REGISTRY}/${{ inputs.image_repo }}:${{ steps.tags.outputs.sha_tag }}"
          docker push "${ECR_REGISTRY}/${{ inputs.image_repo }}:arm64"

      - name: Summary
        if: always()
        run: |
          echo "### ${{ inputs.image_repo }} (arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ inputs.image_repo }}:arm64\` (+ \`${{ steps.tags.outputs.sha_tag }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- smoke: \`${{ inputs.smoke_script }}\` (native arm64, run inside image before push)" >> "$GITHUB_STEP_SUMMARY"

