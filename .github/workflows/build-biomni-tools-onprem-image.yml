name: Build biomni-tools (on-prem, GHCR)

# Builds the on-prem edition of the biomni-tools container and pushes it to
# GHCR as ghcr.io/biomate-ai/biomni-tools:latest.
#
# This image uses python:3.10-slim as its base (public, no ECR auth required),
# making it suitable for customer on-prem deployments.
#
# install.sh pulls this image and retags it as biomate/biomni-tools:latest,
# which is the name referenced in all Nextflow .nf workflow files for local
# (non-Batch) execution.
#
# Triggered: on workflow_dispatch (manual) and on push to integration/next-phase
# when the Dockerfile.onprem changes.

on:
  workflow_dispatch: {}
  push:
    branches:
      - integration/next-phase
    paths:
      - backend/docker/biomni-tools/Dockerfile.onprem
      - backend/docker/biomni-tools/smoke.py

permissions:
  packages: write
  contents: read

env:
  GHCR_IMAGE: ghcr.io/biomate-ai/biomni-tools

jobs:
  build-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_TAG="onprem-${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_sha_tag=${GHCR_IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image (x86, public base — no ECR auth needed)
        run: |
          docker build \
            --platform linux/amd64 \
            -f backend/docker/biomni-tools/Dockerfile.onprem \
            -t "${{ steps.tags.outputs.full_sha_tag }}" \
            .

      - name: Smoke test (gates the push)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend/docker/biomni-tools/smoke.py:/smoke.py:ro" \
            "${{ steps.tags.outputs.full_sha_tag }}" \
            python3 /smoke.py

      - name: Push sha tag + :latest (only if smoke passed)
        run: |
          docker push "${{ steps.tags.outputs.full_sha_tag }}"
          docker tag "${{ steps.tags.outputs.full_sha_tag }}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:latest"

      - name: Summary
        if: always()
        run: |
          echo "### biomni-tools (on-prem)" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha tag: \`${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pushed as: \`${GHCR_IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- base: python:3.10-slim (public)" >> "$GITHUB_STEP_SUMMARY"
