name: Build nextflow-base image

# Builds biomate-nextflow-base — the shared base for all biomni-* Batch containers.
#
# Strategy: two native-runner jobs in parallel (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm) then a merge-manifest job creates a multi-arch :latest in ECR.
# No QEMU: each runner builds natively for its own platform.
#
# FROM python:3.11-slim is a public Docker Hub image → no ECR auth needed for the
# pull; only the push to ECR requires credentials (handled via OIDC role + ecr-login).
#
# Downstream images that FROM this base:
#   biomate/biomni-admet, biomate/biomni-tools, biomate/biomni-pharma,
#   biomate/biomni-structure-to-drug, biomate/genomics-germline,
#   biomate/openfe-rbfe, biomate/sra-tools
# All must be rebuilt after this image changes.

on:
  workflow_dispatch: {}
  push:
    paths:
      - aws_infrastructure/configs/Dockerfile.nextflow-base
      - .github/workflows/build-nextflow-base-image.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-nextflow-base-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate-nextflow-base
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush

jobs:
  # ── Per-platform native build ─────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tag
        id: tags
        run: echo "sha_tag=${GITHUB_SHA::12}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build and push per-platform image
        uses: docker/build-push-action@v6
        with:
          context: aws_infrastructure/configs
          file: aws_infrastructure/configs/Dockerfile.nextflow-base
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-${{ matrix.suffix }},mode=max

      - name: Smoke — aws CLI works inside image
        run: |
          docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
            aws --version
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
            python3 -c "import numpy, scipy, pandas, biopython, rdkit; print('imports OK')"

      - name: Summary
        if: always()
        run: |
          echo "### nextflow-base (${{ matrix.suffix }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Merge into multi-arch :latest ─────────────────────────────────────────────
  merge-manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (for imagetools)
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch :latest manifest
        run: |
          SHA="${GITHUB_SHA::12}"
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${SHA}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${SHA}-arm64"
          echo "✓ :latest now points to amd64 + arm64"

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}'

      - name: Summary
        run: |
          echo "### biomate-nextflow-base :latest (multi-arch)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: \`linux/amd64\` + \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next step: rebuild derived images (biomni-admet, biomni-tools, etc.)" >> "$GITHUB_STEP_SUMMARY"
          echo "  Then set \`build_arm64: true\` in their caller workflows." >> "$GITHUB_STEP_SUMMARY"
