name: Build workflow-tools (on-prem, GHCR)

# Builds the on-prem edition of the workflow-tools container and pushes it to
# GHCR as ghcr.io/biomate-ai/workflow-tools:latest.
#
# This image uses python:3.11-slim-bookworm (public, no ECR auth required),
# making it suitable for customer on-prem deployments.
#
# install.sh pulls this image and retags it as biomate/workflow-tools:latest,
# which is the name referenced in all Nextflow .nf workflow files for local
# (non-Batch) execution.
#
# Triggered: on workflow_dispatch (manual) and on push to integration/next-phase
# when the Dockerfile.onprem changes.

on:
  workflow_dispatch: {}
  push:
    branches:
      - integration/next-phase
    paths:
      - backend/docker/workflow-tools/Dockerfile.onprem
      - backend/docker/workflow-tools/smoke.py
      - backend/biomni_workflows/nextflow_nfcore/subworkflows/pharmacology/calculate_physicochemical_properties/main.nf

permissions:
  packages: write
  contents: read

env:
  GHCR_IMAGE: ghcr.io/biomate-ai/workflow-tools

jobs:
  build-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_TAG="onprem-${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_sha_tag=${GHCR_IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Smoke on amd64 only (native runner) — gates the multi-arch push.
      # We build amd64 first with `load`, smoke it, then do the full multi-arch push.
      - name: Build amd64 image for smoke (public base — no ECR auth needed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/workflow-tools/Dockerfile.onprem
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.tags.outputs.full_sha_tag }}

      - name: Smoke test on amd64 (gates the push)
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }}/backend/biomni_workflows/nextflow_nfcore/subworkflows/pharmacology/calculate_physicochemical_properties/main.nf,target=/canonical-workflow.nf,readonly" \
            -v "${{ github.workspace }}/backend/docker/workflow-tools/smoke.py:/smoke.py:ro" \
            "${{ steps.tags.outputs.full_sha_tag }}" \
            python3 /smoke.py

      - name: Build and push multi-arch image (amd64 + arm64)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/workflow-tools/Dockerfile.onprem
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.full_sha_tag }}
            ${{ env.GHCR_IMAGE }}:latest

      - name: Summary
        if: always()
        run: |
          echo "### workflow-tools (on-prem, multi-arch)" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha tag: \`${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- publication outcome: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.publish.outcome }}" == "success" ]]; then
            echo "- pushed as: \`${GHCR_IMAGE}:latest\` (linux/amd64 + linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- image publication was not successful; do not use this run as release evidence" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- runtime smoke: amd64 only; ARM64 still requires native qualification" >> "$GITHUB_STEP_SUMMARY"
          echo "- base: python:3.11-slim-bookworm (public)" >> "$GITHUB_STEP_SUMMARY"
