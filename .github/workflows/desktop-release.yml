name: Desktop Release

# Builds and publishes BioMate desktop installers for all platforms
# on every v*.*.* git tag. Creates a draft GitHub Release.
#
# Required secrets in GitHub repository settings:
# TAURI_SIGNING_PRIVATE_KEY          - for update signatures (generate with: tauri signer generate)
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD - password for the above
# APPLE_CERTIFICATE                  - base64-encoded macOS Developer ID cert (.p12)
# APPLE_CERTIFICATE_PASSWORD         - cert export password
# APPLE_SIGNING_IDENTITY             - e.g. "Developer ID Application: BioMate AI (XXXXXXXXXX)"
# APPLE_ID                           - Apple ID email for notarization
# APPLE_PASSWORD                     - app-specific password for notarization (not your Apple ID password)
# APPLE_TEAM_ID                      - Apple Developer team ID (10-char string)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: BioMate ${{ github.ref_name }}
          releaseBody: |
            ## BioMate ${{ github.ref_name }}

            See [CHANGELOG](https://github.com/bioMate-AI/biomate/blob/main/CHANGELOG.md) for details.

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Intel + Apple Silicon) | `BioMate_*.dmg` |
            | Windows | `BioMate_*.msi` |
            | Linux (Debian/Ubuntu) | `biomate_*.deb` |
            | Linux (AppImage) | `BioMate_*.AppImage` |

            > **macOS:** If Gatekeeper blocks the app, right-click → Open the first time.
            > Code signing requires Apple Developer certificates (not yet configured).
          releaseDraft: true
          prerelease: false
