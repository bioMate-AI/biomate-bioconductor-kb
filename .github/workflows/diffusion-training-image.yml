name: Build & push diffusion-training image

# protein_diffusion (RFdiffusion, SE(3) backbone design) GPU training image.
# Mirror of ml-training-image.yml — builds a CUDA image, pushes to ECR, smokes
# the CLI. Building needs no GPU (CUDA runtime is in the base image); running
# does (the .nf TRAIN process carries label 'process_gpu').
#
# Prereq: the ECR repo biomate/diffusion-training must exist.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'diffusion-training-v**'

permissions:
  id-token: write     # OIDC assume-role
  contents: read

concurrency:
  group: diffusion-training-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate/diffusion-training
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # RFdiffusion + SE3Transformer + torch-cu118 is a large build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This branch carries ~1.2GB of committed data (galaxy_ai_tools.db,
          # docs/*.npz, figures). A full checkout stalls the runner before the
          # disk-cleanup step. The Docker build only needs the ml_training source
          # (one COPY) + this Dockerfile; weights are fetched inside the image.
          sparse-checkout: |
            backend/lib/galaxy/ai/ml_training
            backend/docker/diffusion-training.Dockerfile
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Compute build tags
        id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/diffusion-training.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max

      - name: Smoke — CLI + weights + rfdiffusion in the pushed image
        run: |
          IMG=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
          docker run --rm "$IMG" python -m ml_training.cli --help >/dev/null
          docker run --rm "$IMG" python -c "
          import torch, rfdiffusion
          from pathlib import Path
          w = Path('/opt/RFdiffusion/models/Base_ckpt.pt')
          assert w.is_file() and w.stat().st_size > 0, w
          assert Path('/opt/RFdiffusion/scripts/run_inference.py').is_file()
          print('diffusion-training image smoke OK', torch.__version__, w.stat().st_size)
          "
          echo "diffusion-training image smoke OK"
