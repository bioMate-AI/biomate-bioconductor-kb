name: Build & push frontend image

# Builds the frontend (Node/Express + React) container on every release tag
# push (and on manual dispatch). Pushes to ECR + GHCR with:
#   - sha-<commit>
#   - main-latest
#   - release-x.y.z (when triggered by a release-* tag push)
#
# Multi-arch strategy: two native-runner jobs (amd64 + arm64) build and
# smoke-test independently, then a merge-manifest job creates the unified tag.
# Frontend has no arch-specific binary downloads — the Node/npm build is
# pure-JS and works identically on both platforms.
#
# Past-incident guardrails: L1 (build-info), L4 (no /home/ literals), L22 (.dockerignore).

on:
  push:
    tags:
      - 'release-v**'
      - 'beta-v**'
      - 'dev-v**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write    # push to GHCR for on-prem distribution

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate/dev-frontend
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush
  GHCR_IMAGE: ghcr.io/biomate-ai/biomate-frontend

jobs:
  # ── Per-platform build + smoke + push ────────────────────────────────────────
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || startsWith(github.ref, 'refs/tags/beta-v') && 'staging' || 'development' }}
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      release_tag: ${{ steps.tags.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-flight — .dockerignore present (L22)
        run: |
          test -f frontend/.dockerignore || { echo "::error::frontend/.dockerignore missing"; exit 1; }
          grep -qE 'node_modules' frontend/.dockerignore || { echo "::error::node_modules not excluded"; exit 1; }

      - name: Setup Node + typecheck
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Compute build tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "branch_tag=$(echo "$BRANCH" | tr '/' '-')-latest" >> "$GITHUB_OUTPUT"
          else
            echo "branch_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/release-* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (platform-native, load locally for smoke)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-${{ matrix.suffix }},mode=max

      - name: Lint — no /home/ literals baked into image (L4)
        run: |
          ALLOWED='/home/(appuser|ubuntu|runner|nate|playwright|sbx_user|jovyan|john|documentation)/'
          HITS=$(docker run --rm --entrypoint sh \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }} \
              -c 'grep -rIE "/home/[a-z]+/" /app \
                    --include="*.js" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.yml" \
                    --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.cache \
                    2>/dev/null | grep -v "^Binary"' \
                  | grep -vE "$ALLOWED" \
                  | head -5 || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Image contains developer-machine /home/<user>/ literals — refusing to push."
            echo "$HITS"
            exit 1
          fi
          echo "OK"

      - name: Push per-platform sha tag (ECR)
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-${{ matrix.suffix }}

  # ── Merge per-platform images into a single multi-arch manifest ───────────────
  merge-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || startsWith(github.ref, 'refs/tags/beta-v') && 'staging' || 'development' }}

    steps:
      - name: Checkout (needed for GHCR VITE_ONPREM rebuild)
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "branch_tag=$(echo "$BRANCH" | tr '/' '-')-latest" >> "$GITHUB_OUTPUT"
          else
            echo "branch_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/release-* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (for imagetools)
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch sha manifest (ECR)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"

      - name: Tag + push branch-scoped moving tag (ECR)
        if: steps.tags.outputs.branch_tag != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.branch_tag }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"

      - name: Tag + push release tag (ECR)
        if: steps.tags.outputs.release_tag != ''
        run: |
          docker buildx imagetools create \
            --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.release_tag }}" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-amd64" \
            "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}-arm64"

      # ── GHCR multi-arch (on-prem, branch + release) ──────────────────────────
      # On-prem uses VITE_ONPREM=true baked at build time → must rebuild, not retag.
      # We build both platforms in a single buildx invocation using QEMU here
      # since this is a separate flag-only rebuild (fast — only the Vite layer differs).
      # Branch builds push a branch-scoped GHCR tag so ARM64 on-prem instances
      # can pull without needing ECR credentials. :latest updated on release only.
      - name: Compute GHCR tags
        id: ghcr_tags
        run: |
          GHCR="${{ env.GHCR_IMAGE }}"
          SHA="${{ steps.tags.outputs.sha_tag }}"
          BRANCH="${{ steps.tags.outputs.branch_tag }}"
          RELEASE="${{ steps.tags.outputs.release_tag }}"
          TAGS="${GHCR}:${SHA}"
          [[ -n "$BRANCH" ]]  && TAGS="${TAGS}
          ${GHCR}:${BRANCH}"
          [[ -n "$RELEASE" ]] && TAGS="${TAGS}
          ${GHCR}:latest
          ${GHCR}:${RELEASE}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push GHCR on-prem multi-arch (VITE_ONPREM=true)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ghcr_tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_ONPREM=true
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache-amd64

      - name: Summary
        run: |
          {
            echo "## Frontend image build (multi-arch: amd64 + arm64)"
            echo "- sha tag: \`${{ steps.tags.outputs.sha_tag }}\`"
            [[ -n "${{ steps.tags.outputs.branch_tag }}" ]]  && echo "- branch tag: \`${{ steps.tags.outputs.branch_tag }}\`" || true
            [[ -n "${{ steps.tags.outputs.branch_tag }}" ]]  && echo "- GHCR branch: \`${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.branch_tag }}\`" || true
            [[ -n "${{ steps.tags.outputs.release_tag }}" ]] && echo "- release tag: \`${{ steps.tags.outputs.release_tag }}\`" || true
            echo "- ECR: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}\`"
            [[ -n "${{ steps.tags.outputs.release_tag }}" ]] && echo "- GHCR: \`${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.release_tag }}\`" || true
          } >> "$GITHUB_STEP_SUMMARY"
