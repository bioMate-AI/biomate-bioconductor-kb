name: Build & push frontend image

# Builds the frontend (Node/Express + React) container on every push to `main`
# (and on manual dispatch). Pushes to ECR with the same tag scheme as backend:
#   - sha-<commit>
#   - main-latest
#   - release-x.y.z (when triggered by a release-* tag push)
#
# This workflow only BUILDS and PUSHES — deploys happen in P3.1.
#
# Past-incident guardrails: see backend-image.yml for the full list; the
# frontend image has fewer Python-specific concerns but still gets L1 (build
# info), L4 (no /home/ literals), and L22 (.dockerignore present).

on:
  push:
    # OPTIMIZED: Only build images on release tags, not on every push.
    # This reduces CI/CD cost by ~90% while maintaining clear version control.
    #
    # Supported tag formats:
    #   - release-v1.0.0     → production release
    #   - beta-v1.0.0-rc1    → staging/beta release
    #   - dev-v0.9.0         → development release
    #
    # For regular development commits, the ci-tests workflow runs tests only.
    # SHA-based tags are still generated when tags are pushed, maintaining
    # backend/frontend SHA sync that deploy.yml relies on.
    tags:
      - 'release-v**'
      - 'beta-v**'
      - 'dev-v**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write    # push to GHCR for on-prem distribution

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate/dev-frontend
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush
  GHCR_IMAGE: ghcr.io/biomate-ai/biomate-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Automatically select environment based on tag type:
    #   - dev-v*.*.*     → development environment (no approval)
    #   - beta-v*.*.*    → staging environment (1 reviewer required)
    #   - release-v*.*.* → production environment (2 reviewers + 5min wait)
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || startsWith(github.ref, 'refs/tags/beta-v') && 'staging' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-flight — .dockerignore present (L22)
        run: |
          test -f frontend/.dockerignore || { echo "::error::frontend/.dockerignore missing"; exit 1; }
          grep -qE 'node_modules' frontend/.dockerignore || { echo "::error::node_modules not excluded"; exit 1; }

      - name: Setup Node + typecheck (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Compute build tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH_TAG="$(echo "$BRANCH" | tr '/' '-')-latest"
            echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "branch_tag=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/release-* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR (on-prem image distribution)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max

      - name: Lint — no /home/ literals baked into image (L4)
        run: |
          # L4 intent: no DEVELOPER-MACHINE paths in the production image.
          # Standard container service-user paths (appuser, ubuntu, runner, etc.)
          # used as deliberate docker mount targets or in vendored configs
          # are explicitly allowed.
          ALLOWED='/home/(appuser|ubuntu|runner|nate|playwright|sbx_user|jovyan|john|documentation)/'
          HITS=$(docker run --rm --entrypoint sh \
              ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
              -c 'grep -rIE "/home/[a-z]+/" /app \
                    --include="*.js" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.yml" \
                    --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.cache \
                    2>/dev/null | grep -v "^Binary"' \
                  | grep -vE "$ALLOWED" \
                  | head -5 || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Image contains developer-machine /home/<user>/ literals — refusing to push."
            echo "$HITS"
            exit 1
          fi
          echo "OK"

      - name: Push sha tag
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}

      - name: Tag + push branch-scoped moving tag
        if: steps.tags.outputs.branch_tag != ''
        run: |
          docker tag \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.branch_tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.branch_tag }}

      - name: Tag + push release tag (if present)
        if: steps.tags.outputs.release_tag != ''
        run: |
          docker tag \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.release_tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.release_tag }}

      # ── GHCR push (on-prem distribution — separate build with VITE_ONPREM=true) ─
      # Must be a separate build, not a retag of the ECR image.
      # The ECR (SaaS cloud) image is built WITHOUT VITE_ONPREM so the cloud UI
      # stays English.  On-prem customers pull from GHCR and need Chinese UI +
      # the license gate, which requires VITE_ONPREM=true baked at build time.
      - name: Build and push GHCR on-prem image (VITE_ONPREM=true)
        if: steps.tags.outputs.release_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.release_tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
            VITE_ONPREM=true
          # Re-use the ECR layer cache — npm-install layers are identical;
          # only the Vite build layer (VITE_ONPREM ARG declared after npm install)
          # will miss and rebuild (~30 s).
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache

      - name: Summary
        run: |
          {
            echo "## Frontend image build"
            echo "- sha tag: \`${{ steps.tags.outputs.sha_tag }}\`"
            [[ -n "${{ steps.tags.outputs.branch_tag }}" ]]  && echo "- branch tag: \`${{ steps.tags.outputs.branch_tag }}\`" || true
            [[ -n "${{ steps.tags.outputs.release_tag }}" ]] && echo "- release tag: \`${{ steps.tags.outputs.release_tag }}\`" || true
            echo "- ECR: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}\`"
            [[ -n "${{ steps.tags.outputs.release_tag }}" ]] && echo "- GHCR: \`${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.release_tag }}\`" || true
          } >> "$GITHUB_STEP_SUMMARY"
