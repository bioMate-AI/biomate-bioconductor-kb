name: Mirror MinIO to GHCR

# Mirrors official MinIO (minio + mc) images to GHCR so on-prem customers can
# pull them using only their GHCR_TOKEN — no Docker Hub auth needed.
#
# Strategy: pull per-arch from Docker Hub (GHA runners have elevated pull
# quota so no auth required), then push per-arch tags and create a multi-arch
# manifest on GHCR. Result:
#   ghcr.io/biomate-ai/minio:latest       → amd64 + arm64 manifest
#   ghcr.io/biomate-ai/minio-mc:latest    → amd64 + arm64 manifest
#
# Triggered: weekly (keeps image fresh) + manual dispatch.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC

permissions:
  packages: write
  contents: read

env:
  MINIO_SRC: minio/minio:latest
  MC_SRC: minio/mc:latest
  MINIO_DST: ghcr.io/biomate-ai/minio
  MC_DST: ghcr.io/biomate-ai/minio-mc

jobs:
  mirror-amd64:
    name: Mirror amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror minio amd64
        run: |
          docker pull --platform linux/amd64 "$MINIO_SRC"
          docker tag "$MINIO_SRC" "$MINIO_DST:latest-amd64"
          docker push "$MINIO_DST:latest-amd64"

      - name: Mirror mc amd64
        run: |
          docker pull --platform linux/amd64 "$MC_SRC"
          docker tag "$MC_SRC" "$MC_DST:latest-amd64"
          docker push "$MC_DST:latest-amd64"

  mirror-arm64:
    name: Mirror arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror minio arm64
        run: |
          docker pull --platform linux/arm64 "$MINIO_SRC"
          docker tag "$MINIO_SRC" "$MINIO_DST:latest-arm64"
          docker push "$MINIO_DST:latest-arm64"

      - name: Mirror mc arm64
        run: |
          docker pull --platform linux/arm64 "$MC_SRC"
          docker tag "$MC_SRC" "$MC_DST:latest-arm64"
          docker push "$MC_DST:latest-arm64"

  merge-manifest:
    name: Merge multi-arch manifests
    runs-on: ubuntu-latest
    needs: [mirror-amd64, mirror-arm64]
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest for minio
        run: |
          docker buildx imagetools create \
            --tag "$MINIO_DST:latest" \
            "$MINIO_DST:latest-amd64" \
            "$MINIO_DST:latest-arm64"
          docker buildx imagetools inspect "$MINIO_DST:latest"

      - name: Create multi-arch manifest for mc
        run: |
          docker buildx imagetools create \
            --tag "$MC_DST:latest" \
            "$MC_DST:latest-amd64" \
            "$MC_DST:latest-arm64"
          docker buildx imagetools inspect "$MC_DST:latest"

      - name: Summary
        run: |
          echo "## MinIO GHCR Mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$MINIO_DST:latest\` (amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$MC_DST:latest\` (amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
