name: Build & push ml-training image

# Lean training image for the BioMate ml_training CLI (Ludwig low-code DL +
# sklearn baseline over RDKit descriptors). Kept separate from the Galaxy
# backend image so ludwig's pinned deps (pydantic 1.10, numpy<2) stay isolated.
# The .nf TRAIN process runs `python -m ml_training.cli` in this image
# (executor sets it via compute_config.container → executor_payload default
# biomate-ml-training:latest, overridable with ML_TRAINING_IMAGE).

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'ml-training-v**'

permissions:
  id-token: write     # OIDC assume-role
  contents: read

concurrency:
  group: ml-training-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate/ml-training
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build tags
        id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ECR repo `biomate-ml-training` (us-west-2) is pre-created out of band —
      # the GitHubActionsECRPush role can push but not ecr:CreateRepository.

      # ludwig + torch pull multiple GB; reclaim the large preinstalled runner
      # toolchains first so the build doesn't hit "No space left on device".
      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/ml-training.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max

      - name: Smoke — CLI runs in the pushed image
        run: |
          # No ENTRYPOINT on purpose (Nextflow process image) — call the CLI
          # explicitly, exactly like the .nf TRAIN process does.
          docker run --rm ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
            python -m ml_training.cli --help >/dev/null
          echo "ml-training image smoke OK"
