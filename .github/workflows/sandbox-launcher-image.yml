name: Build & push sandbox-launcher image

# Builds the tiny BioMate sandbox-launcher sidecar (docker:27-cli + python3
# stdlib only) and pushes it to GHCR so on-prem customers can pull it without
# AWS credentials.  The image exposes port 8899 and is the only container with
# Docker access; app containers reach it over HTTP and can only run validated
# RunSpecs.  See deploy/sandbox-launcher/launcher.py for the security contract.

on:
  workflow_dispatch: {}
  push:
    branches:
      - integration/next-phase
      - main
    paths:
      - 'deploy/sandbox-launcher/**'

permissions:
  contents: read
  packages: write   # GHCR push

concurrency:
  group: sandbox-launcher-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox-launcher
          file: deploy/sandbox-launcher/Dockerfile
          push: true
          tags: |
            ghcr.io/biomate-ai/biomate-sandbox-launcher:${{ steps.tags.outputs.sha_tag }}
            ghcr.io/biomate-ai/biomate-sandbox-launcher:latest
          cache-from: type=registry,ref=ghcr.io/biomate-ai/biomate-sandbox-launcher:buildcache
          cache-to: type=registry,ref=ghcr.io/biomate-ai/biomate-sandbox-launcher:buildcache,mode=max

      - name: Smoke — health endpoint responds
        run: |
          cid=$(docker run -d --rm -p 18899:8899 \
            ghcr.io/biomate-ai/biomate-sandbox-launcher:${{ steps.tags.outputs.sha_tag }})
          sleep 2
          curl -sf http://localhost:18899/health | grep '"ok":true'
          docker stop "$cid"
          echo "sandbox-launcher smoke OK"

      - name: Summary
        run: |
          echo "## sandbox-launcher image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/biomate-ai/biomate-sandbox-launcher:${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/biomate-ai/biomate-sandbox-launcher:latest\`" >> "$GITHUB_STEP_SUMMARY"
