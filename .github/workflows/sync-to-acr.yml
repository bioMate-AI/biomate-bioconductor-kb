name: Sync Images to Alibaba ECS

on:
  push:
    branches:
      - feat/aliyun-demo-deploy
    paths:
      - '.github/workflows/sync-to-acr.yml'
  workflow_dispatch:
    inputs:
      skip_assets:
        description: 'Skip asset transfer (DB + nfcore already in volumes)'
        type: boolean
        default: true
      check_only:
        description: 'Only check ECS status — skip transfer and restart'
        type: boolean
        default: false
      pull_biomni_tools:
        description: 'Pull biomni-tools from GHCR → ECS (~800MB, run once). Required for ADMET + pharmacology workflows.'
        type: boolean
        default: false

permissions:
  packages: read
  contents: read

env:
  TAG: fix-arm64-minio-healthcheck-and-qemu-latest
  ECS_IP: 101.201.107.126
  DB_URL: https://biomate-onprem-assets.s3.us-west-2.amazonaws.com/onprem/galaxy_ai_tools.db
  NFCORE_URL: https://biomate-onprem-assets.s3.us-west-2.amazonaws.com/onprem/nextflow_nfcore_subworkflows.tar.gz

jobs:
  transfer-assets:
    # Download galaxy_ai_tools.db (~280 MB) and nfcore tar (~60 MB) from S3
    # on the GHA runner (fast US connection), then SSH-pipe to ECS and drop
    # them into the Docker volumes so db-init / nfcore-init skip their
    # slow China→S3 downloads.
    # Skip when assets are already in the volumes (workflow_dispatch default).
    if: ${{ !inputs.check_only && (github.event_name == 'push' || !inputs.skip_assets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Download workflow DB from S3 and pipe to ECS volume
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          echo "Downloading galaxy_ai_tools.db (~280 MB) from S3..."
          curl -fL --retry 3 --progress-bar "${{ env.DB_URL }}" | \
            sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
              root@${{ env.ECS_IP }} \
              'cat > /tmp/galaxy_ai_tools.db && \
               VOLPATH=$(docker volume inspect biomate-onprem_biomate-backend-db --format "{{.Mountpoint}}") && \
               mkdir -p "$VOLPATH" && \
               mv /tmp/galaxy_ai_tools.db "$VOLPATH/galaxy_ai_tools.db" && \
               ls -lh "$VOLPATH/galaxy_ai_tools.db" && \
               echo "DB installed to volume"'

      - name: Download nfcore workflows and pipe to ECS volume
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          echo "Downloading nfcore workflows (~60 MB) from S3..."
          curl -fL --retry 3 --progress-bar "${{ env.NFCORE_URL }}" | \
            sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
              root@${{ env.ECS_IP }} \
              'VOLPATH=$(docker volume inspect biomate-onprem_biomate-nfcore-workflows --format "{{.Mountpoint}}") && \
               mkdir -p "$VOLPATH" && \
               tar -xzf - -C "$VOLPATH" && \
               touch "$VOLPATH/.initialized" && \
               echo "nfcore workflows extracted to $VOLPATH" && \
               ls "$VOLPATH" | head -5'

  restart-stack:
    runs-on: ubuntu-latest
    # Run even if transfer-assets was skipped (needs treats skipped as success).
    needs: [transfer-assets]
    if: ${{ always() && !inputs.check_only }}
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Add CORS_ORIGINS to .env so IP-based access works (not just biomate.ai)
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'ENV_FILE=/app/biomate/.env && \
             grep -q "^CORS_ORIGINS=" "$ENV_FILE" && \
               sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=http://101.201.107.126:5000|" "$ENV_FILE" || \
               echo "CORS_ORIGINS=http://101.201.107.126:5000" >> "$ENV_FILE" && \
             echo "CORS_ORIGINS in .env:" && grep CORS_ORIGINS "$ENV_FILE"'

      - name: Remove stale involucro.lock from database volume
        # Galaxy acquires /app/database/dependencies/involucro.lock on startup.
        # If the lock is left over from a crash, every restart times out after
        # 300 s and exits cleanly (ExitCode=0) → endless restart loop.
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'VOLPATH=$(docker volume inspect biomate-onprem_biomate-backend-db --format "{{.Mountpoint}}" 2>/dev/null) && \
             if [ -n "$VOLPATH" ]; then
               rm -f "$VOLPATH/dependencies/involucro.lock" && \
               echo "Removed stale lock (if any) from $VOLPATH/dependencies/" && \
               ls "$VOLPATH/dependencies/" 2>/dev/null || echo "(dependencies dir empty or absent)"
             else
               echo "Volume not found yet — will be created on first compose up"
             fi'

      - name: Fix backend/config dir ownership so galaxy user (uid=1000) can write
        # The compose bind-mount ./backend/config:/app/config points to a host dir
        # that Docker auto-creates as root-owned when absent.  uid=1000 (galaxy)
        # cannot write to it and the startup script fails with Permission denied.
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'mkdir -p /app/biomate/backend/config && \
             chown -R 1000:1000 /app/biomate/backend/config && \
             chmod 755 /app/biomate/backend/config && \
             echo "backend/config perms: $(ls -la /app/biomate/backend/ | grep config)"'

      - name: Set BIOMATE_ADMET_CONTAINER to use biomni-tools as ADMET fallback
        # biomni-admet (the real ADMET-AI image) lives only on private AWS ECR and
        # cannot be pulled from ECS without credentials. Set BIOMATE_ADMET_CONTAINER
        # so nextflow_executor.py generates a process-level override pointing to
        # biomni-tools (which has the biomni package + RDKit ADMET fallback).
        # The nfcore ADMET workflow gracefully degrades: admet_ai ImportError →
        # rows=[] → reduce step uses RDKit structural estimates. Acceptable for demo.
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'ENV_FILE=/app/biomate/.env && \
             grep -q "^BIOMATE_ADMET_CONTAINER=" "$ENV_FILE" && \
               sed -i "s|^BIOMATE_ADMET_CONTAINER=.*|BIOMATE_ADMET_CONTAINER=biomate/biomni-tools:latest|" "$ENV_FILE" || \
               echo "BIOMATE_ADMET_CONTAINER=biomate/biomni-tools:latest" >> "$ENV_FILE" && \
             echo "BIOMATE_ADMET_CONTAINER set to biomni-tools fallback"'

      - name: Fix Galaxy DB — switch from SQLite to PostgreSQL
        # galaxy.yml.template defaults to SQLite (database_connection: sqlite:///.../universe.sqlite).
        # With multiple gunicorn workers, concurrent SQLite writes cause "database is locked" errors
        # that abort running workflows. Override to the PostgreSQL instance already in the stack.
        # Galaxy auto-creates its schema on first PostgreSQL startup (no manual migration needed).
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'ENV_FILE=/app/biomate/.env && \
             PG_USER=$(grep "^POSTGRES_USER=" "$ENV_FILE" | cut -d= -f2- | tr -d "\"" | xargs || echo "biomate") && \
             PG_DB=$(grep "^POSTGRES_DB=" "$ENV_FILE" | cut -d= -f2- | tr -d "\"" | xargs || echo "biomate") && \
             PG_PASS=$(grep "^POSTGRES_PASSWORD=" "$ENV_FILE" | cut -d= -f2- | tr -d "\"") && \
             DB_CONN="postgresql+psycopg2://${PG_USER}:${PG_PASS}@postgres:5432/${PG_DB}?client_encoding=utf8" && \
             grep -q "^GALAXY_CONFIG_OVERRIDE_DATABASE_CONNECTION=" "$ENV_FILE" && \
               sed -i "s|^GALAXY_CONFIG_OVERRIDE_DATABASE_CONNECTION=.*|GALAXY_CONFIG_OVERRIDE_DATABASE_CONNECTION=${DB_CONN}|" "$ENV_FILE" || \
               echo "GALAXY_CONFIG_OVERRIDE_DATABASE_CONNECTION=${DB_CONN}" >> "$ENV_FILE" && \
             echo "Galaxy DB set to PostgreSQL" && \
             grep "^GALAXY_CONFIG_OVERRIDE_DATABASE_CONNECTION=" "$ENV_FILE" | sed "s/:.*@/:***@/"'

      - name: Pull biomni-tools image from GHCR and transfer to ECS
        # biomate/biomni-tools:latest is the image Nextflow uses for ADMET and other
        # pharmacology workflows. It lives on GHCR (ghcr.io/biomate-ai/biomni-tools:latest)
        # and must be pulled once and retagged on ECS. Without it every workflow run
        # fails with "image not found" (exit 1). Run this step once; image is then cached.
        if: ${{ inputs.pull_biomni_tools == true }}
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if biomate/biomni-tools:latest already exists on ECS..."
          EXISTS=$(sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no root@${{ env.ECS_IP }} \
            'docker image inspect biomate/biomni-tools:latest >/dev/null 2>&1 && echo yes || echo no')
          if [ "$EXISTS" = "yes" ]; then
            echo "Image already present on ECS — skipping transfer"
            exit 0
          fi

          echo "Logging in to GHCR on GHA runner..."
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Pulling ghcr.io/biomate-ai/biomni-tools:latest..."
          docker pull ghcr.io/biomate-ai/biomni-tools:latest

          echo "Saving + piping to ECS (expect 3–8 min for ~800MB)..."
          docker save ghcr.io/biomate-ai/biomni-tools:latest | gzip | \
            sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              root@${{ env.ECS_IP }} \
              'gunzip | docker load && \
               docker tag ghcr.io/biomate-ai/biomni-tools:latest biomate/biomni-tools:latest && \
               echo "=== biomate/biomni-tools:latest installed on ECS ===" && \
               docker image inspect biomate/biomni-tools:latest --format "ID={{.Id}}"'

      - name: Restart stack
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'cd /app/biomate && \
             docker compose -f docker-compose.onprem.yml down --remove-orphans 2>&1 | tail -5 && \
             docker compose -f docker-compose.onprem.yml --env-file .env up -d 2>&1 | tail -20 && \
             sleep 15 && \
             docker compose -f docker-compose.onprem.yml ps'

      - name: Patch nextflow_executor.py — add --pull never so DaoCloud mirror cannot block pre-loaded images
        # DaoCloud registry mirror (daemon.json on Alibaba ECS) intercepts ALL docker pull calls,
        # even for images already loaded locally via docker load. Adding --pull never to Docker
        # runOptions makes Nextflow use local images directly without any registry check.
        # This file is baked into the container image, so we patch it via docker exec + reload gunicorn.
        # Idempotent: grep check prevents double-patching.
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'FILE=$(docker exec biomate-galaxy find /app -name "nextflow_executor.py" 2>/dev/null | head -1) && \
             if [ -z "$FILE" ]; then echo "ERROR: nextflow_executor.py not found in container"; exit 1; fi && \
             echo "Found: $FILE" && \
             if docker exec biomate-galaxy grep -q -- "--pull never" "$FILE"; then
               echo "Already patched — skipping"
             else
               docker exec biomate-galaxy sed -i "s/--user root --network/--user root --pull never --network/g" "$FILE" && \
               echo "Patched --pull never into $FILE" && \
               GPID=$(docker exec biomate-galaxy pgrep -f "gunicorn" | head -1) && \
               docker exec biomate-galaxy kill -HUP "$GPID" && \
               echo "Gunicorn HUP sent (pid=$GPID) — workers will reload"
             fi'

      - name: Patch index.html — remove Google CDN links (blocked in China)
        # Google Fonts and Google Tag Manager are inaccessible from mainland China.
        # Browsers hang waiting for these resources, causing a white blank page.
        # Patch the built index.html in-place; Express reads from disk per request
        # so no container restart needed.
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'docker exec biomate-frontend sh -c "
              sed -i \"/fonts.googleapis.com/d; /fonts.gstatic.com/d; /googletagmanager.com/d\" \
                /app/dist/public/index.html && \
              echo \"Patched index.html — removed Google CDN lines\" && \
              grep -c \"googleapis\|googletagmanager\" /app/dist/public/index.html || echo \"0 Google CDN lines remaining\"
            "'

      - name: Wait for galaxy-backend to start (up to 3 min)
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'for i in $(seq 1 18); do
               STATUS=$(docker inspect biomate-galaxy --format "{{.State.Status}}" 2>/dev/null || echo "missing")
               echo "[$i/18] galaxy: $STATUS"
               if [ "$STATUS" = "running" ]; then
                 LOGS=$(docker logs biomate-galaxy --tail 20 2>&1)
                 echo "--- last 20 log lines ---"
                 echo "$LOGS"
                 if echo "$LOGS" | grep -q "listening on"; then
                   echo "Galaxy backend UP"
                   break
                 fi
               fi
               sleep 10
             done
             echo "=== Final container status ==="
             docker compose -f /app/biomate/docker-compose.onprem.yml ps
             echo "=== galaxy-backend last 30 lines ==="
             docker logs biomate-galaxy --tail 30 2>&1 || true'

  check-status:
    runs-on: ubuntu-latest
    needs: [transfer-assets, restart-stack]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Check ECS galaxy status and logs
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 \
            root@${{ env.ECS_IP }} \
            'echo "=== Container status ===" && \
             docker compose -f /app/biomate/docker-compose.onprem.yml ps && \
             echo "" && \
             echo "=== galaxy inspect ===" && \
             docker inspect biomate-galaxy --format "RestartCount={{.RestartCount}} Status={{.State.Status}} ExitCode={{.State.ExitCode}}" 2>/dev/null || echo "container missing" && \
             echo "" && \
             echo "=== biomni-tools image ===" && \
             docker image inspect biomate/biomni-tools:latest --format "ID={{.Id}} Size={{.Size}}" 2>/dev/null || echo "biomate/biomni-tools:latest NOT found — workflows will fail" && \
             echo "" && \
             echo "=== galaxy logs (last 60 min, non-tool-loading) ===" && \
             docker logs biomate-galaxy --since 60m 2>&1 | grep -v "Loaded tool id" | grep -v "Skipping tool panel" | tail -80 || echo "(no logs)" && \
             echo "" && \
             echo "=== last Nextflow workflow errors (nf-work) ===" && \
             find /app/nf-work -name ".command.err" -newer /app/nf-work -printf "%T@ %p\n" 2>/dev/null | sort -rn | head -3 | awk "{print \$2}" | while read f; do echo "--- $f ---"; tail -20 "$f" 2>/dev/null; done && \
             echo "" && \
             echo "=== backend/config contents ===" && \
             ls -la /app/biomate/backend/config/ 2>/dev/null || echo "(empty)" && \
             echo "" && \
             echo "=== frontend health ===" && \
             curl -sf --max-time 5 http://localhost:5000/api/health 2>/dev/null || echo "frontend unreachable"'
