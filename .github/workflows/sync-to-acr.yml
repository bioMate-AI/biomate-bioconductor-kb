name: Sync Images to Alibaba ECS

on:
  push:
    branches:
      - feat/aliyun-demo-deploy
    paths:
      - '.github/workflows/sync-to-acr.yml'
  workflow_dispatch:

env:
  TAG: fix-arm64-minio-healthcheck-and-qemu-latest
  ECS_IP: 101.201.107.126

jobs:
  transfer-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer frontend image via SSH pipe
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          docker pull ghcr.io/biomate-ai/biomate-frontend:${{ env.TAG }}
          docker save ghcr.io/biomate-ai/biomate-frontend:${{ env.TAG }} | \
            gzip -1 | \
            sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
              root@${{ env.ECS_IP }} \
              'docker load && echo "Frontend loaded!"'

  transfer-backend:
    # Separate job = fresh runner disk.
    # Remove pre-installed tools (~13 GB) first so docker pull of the 4.6 GB
    # compressed backend image (9-14 GB uncompressed) has room to land.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (remove Android SDK + .NET + Haskell)
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "=== After cleanup ==="
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Transfer backend image via SSH pipe
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          echo "Pulling backend (4.6 GB compressed, ~14 GB on disk)..."
          docker pull ghcr.io/biomate-ai/biomate-backend:${{ env.TAG }}
          echo "Disk after pull:"
          df -h /
          echo "Streaming backend to ECS..."
          docker save ghcr.io/biomate-ai/biomate-backend:${{ env.TAG }} | \
            gzip -1 | \
            sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              root@${{ env.ECS_IP }} \
              'docker load && echo "Backend loaded!"'

  verify-and-start:
    runs-on: ubuntu-latest
    needs: [transfer-frontend, transfer-backend]
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Verify images on ECS
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no root@${{ env.ECS_IP }} \
            'docker images | grep biomate'

      - name: Start BioMate stack
        env:
          ECS_PASS: ${{ secrets.ECS_ROOT_PASS }}
        run: |
          sshpass -p "$ECS_PASS" ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            root@${{ env.ECS_IP }} \
            'cd /app/biomate && docker compose -f docker-compose.onprem.yml --env-file .env up -d 2>&1 | tail -30 && echo "--- container status ---" && docker compose -f docker-compose.onprem.yml ps'
