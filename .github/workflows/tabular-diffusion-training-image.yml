name: Build & push tabular-diffusion-training image

# tabular_diffusion (TabDDPM / TabSyn, generic tabular-row generation) GPU
# training image. Mirror of sc-diffusion-training-image.yml.
#
# Prereq: the ECR repo biomate/tabular-diffusion-training must exist.
# NOTE: the Dockerfile installs TabDDPM/TabSyn from GitHub HEAD; pin those to
# reviewed commits and verify the build resolves (torch 2.5.1 / pandas deps)
# before relying on it for a real run.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'tabular-diffusion-training-v**'

permissions:
  id-token: write     # OIDC assume-role
  contents: read

concurrency:
  group: tabular-diffusion-training-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 399683337364.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPO: biomate/tabular-diffusion-training
  ROLE_ARN: arn:aws:iam::399683337364:role/GitHubActionsECRPush

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This branch carries ~1.2GB of committed data (galaxy_ai_tools.db,
          # docs/*.npz, figures). A full checkout stalls the runner before the
          # disk-cleanup step. The Docker build only needs the ml_training source
          # (one COPY) + this Dockerfile; everything else is pip/git installs. A
          # blob-filtered sparse checkout fetches just those paths, which also
          # keeps `context: .` tiny.
          sparse-checkout: |
            backend/lib/galaxy/ai/ml_training
            backend/docker/tabular-diffusion-training.Dockerfile
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Compute build tags
        id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/docker/tabular-diffusion-training.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max

      - name: Smoke — CLI runs in the pushed image
        run: |
          docker run --rm ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ steps.tags.outputs.sha_tag }} \
            python -m ml_training.cli --help >/dev/null
          echo "tabular-diffusion-training image smoke OK"
