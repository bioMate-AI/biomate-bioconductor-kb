
# Data Source Configurations for Auto-Update System

# =============================================================================
# MANUAL REPOSITORIES - High-priority tools added 2026-01-19
# These are cutting-edge tools that should be tracked and integrated
# =============================================================================
manual_repos:
  # Arc Institute - Virtual Cell and DNA Foundation Models
  - repo: ArcInstitute/state
    name: State
    category: single-cell
    description: "Virtual cell model predicting perturbation responses"
    priority: high

  - repo: ArcInstitute/evo2
    name: Evo 2
    category: genomics
    description: "40B parameter DNA foundation model"
    priority: high
    api: "NVIDIA NIM"

  # Structure Prediction
  - repo: chaidiscovery/chai-lab
    name: Chai-1
    category: structure-prediction
    description: "Multi-modal structure prediction (protein, DNA, RNA, ligands)"
    priority: high
    has_mcp: true

  - repo: jwohlwend/boltz
    name: Boltz-2
    category: structure-prediction
    description: "Structure and binding affinity prediction (MIT license)"
    priority: high
    has_mcp: true

  - repo: google-deepmind/alphafold3
    name: AlphaFold 3
    category: structure-prediction
    description: "Biomolecular complex structure prediction"
    priority: high
    has_mcp: true
    license: "CC-BY-NC-SA"

  # Drug Discovery
  - repo: bowen-gao/DrugCLIP
    name: DrugCLIP
    category: drug-discovery
    description: "Virtual screening 10M× faster than traditional methods"
    priority: high
    doi: "10.1126/science.ads9530"

  - repo: catalystforyou/SynCraft-Core
    name: SynCraft
    category: drug-discovery
    description: "LLM-guided synthesizability optimization"
    priority: medium

  # Protein Analysis & Design
  - repo: westlake-repl/ProTrek
    name: ProTrek
    category: protein-analysis
    description: "Trimodal protein language model for sequence-structure-function"
    priority: high
    doi: "10.1038/s41587-025-02836-0"
    api: "search-protrek.com"

  - repo: alex-hh/profam
    name: ProFam-1
    category: protein-analysis
    description: "Protein family language model for fitness prediction"
    priority: medium

  - repo: jbderoo/scFv_Pmpnn_AF2
    name: scFv_Pmpnn_AF2
    category: protein-design
    description: "AI-assisted intrabody design pipeline"
    priority: medium
    doi: "10.1126/sciadv.adx8352"

github:
  api_url: https://api.github.com
  topics:
    # Core bioinformatics
    - bioinformatics
    - genomics
    - proteomics
    - metabolomics
    - computational-biology
    # Sequencing & Analysis
    - single-cell
    - rna-seq
    - variant-calling
    - transcriptomics
    - systems-biology
    - metagenomics
    - phylogenetics
    - sequence-analysis
    - sequence-alignment
    # Specific technologies
    - chip-seq
    - atac-seq
    - hi-c
    - long-read-sequencing
    - nanopore
    - pacbio
    # Genome & Assembly
    - genome-assembly
    - genome-annotation
    - genome-editing
    - crispr
    # Structural biology
    - protein-structure
    - structural-biology
    - molecular-dynamics
    - alphafold
    # Omics
    - multi-omics
    - spatial-transcriptomics
    - epigenetics
    - methylation
    # Population & Evolution
    - population-genetics
    - gwas
    - phylogenomics
    - ancient-dna
    # Drug discovery
    - drug-discovery
    - cheminformatics
    - molecular-docking
    # Other domains
    - flow-cytometry
    - imaging
    - mass-spectrometry
  min_stars: 50
  lookback_days: 90
  languages:
    - Python
    - R
    - Nextflow
    - Snakemake
    - WDL
    - Rust
    - Julia
  excluded_keywords:
    - tutorial
    - course
    - workshop
    - homework
    - assignment

huggingface:
  api_url: https://huggingface.co/api
  tags:
    - biology
    - genomics
    - protein-folding
    - drug-discovery
    - chemistry
    - protein
    - dna
    - rna
  min_downloads: 100
  min_likes: 10

pubmed:
  api_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
  search_terms:
    - "bioinformatics software[Title/Abstract]"
    - "genomics tool[Title/Abstract]"
    - "computational pipeline[Title/Abstract]"
  lookback_months: 6
  max_results: 100
  journals:
    - "Bioinformatics"
    - "BMC Bioinformatics"
    - "Nature Methods"
    - "Nucleic Acids Research"

quality_thresholds:
  auto_approve: 0.8
  review_queue: 0.5
  min_score: 0.5

rate_limits:
  github:
    requests_per_hour: 5000  # With authentication
    backoff_multiplier: 2
    max_retries: 3
  huggingface:
    requests_per_minute: 60
  pubmed:
    requests_per_second: 3
