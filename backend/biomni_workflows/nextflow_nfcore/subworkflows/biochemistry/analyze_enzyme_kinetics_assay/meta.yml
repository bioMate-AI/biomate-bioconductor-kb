name: "analyze_enzyme_kinetics_assay"
description: "Performs in vitro enzyme kinetics assay and analyzes the dose-dependent effects of modulators."
keywords:
  - biochemistry
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: enzyme_name
    type: string
    description: Parameter enzyme_name
  - name: substrate_concentrations
    type: string
    description: Parameter substrate_concentrations
  - name: enzyme_concentration
    type: string
    description: Parameter enzyme_concentration
  - name: modulators
    type: string
    description: Parameter modulators
  - name: time_points
    type: string
    description: Parameter time_points

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
