name: "analyze_itc_binding_thermodynamics"
description: "Analyzes isothermal titration calorimetry (ITC) data to determine binding affinity and thermodynamic parameters."
keywords:
  - biochemistry
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: itc_data_path
    type: string
    description: Parameter itc_data_path
  - name: itc_data
    type: string
    description: Parameter itc_data
  - name: protein_concentration
    type: string
    description: Parameter protein_concentration
  - name: ligand_concentration
    type: string
    description: Parameter ligand_concentration

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
