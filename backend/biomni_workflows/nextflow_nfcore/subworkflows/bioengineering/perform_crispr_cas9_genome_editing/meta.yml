name: "perform_crispr_cas9_genome_editing"
description: "Simulates CRISPR-Cas9 genome editing process including guide RNA design, delivery, and analysis."
keywords:
  - bioengineering
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: guide_rna_sequences
    type: string
    description: Parameter guide_rna_sequences
  - name: target_genomic_loci
    type: string
    description: Parameter target_genomic_loci
  - name: cell_tissue_type
    type: string
    description: Parameter cell_tissue_type

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
