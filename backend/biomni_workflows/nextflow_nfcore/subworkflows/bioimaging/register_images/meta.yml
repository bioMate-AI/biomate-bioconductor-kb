name: "register_images"
description: "Bioimaging helper: register_images"
keywords:
  - bioimaging
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: fixed_image
    type: string
    description: Parameter fixed_image
  - name: moving_image
    type: string
    description: Parameter moving_image
  - name: transform
    type: string
    description: Parameter transform
  - name: registration_method
    type: string
    description: Parameter registration_method

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
