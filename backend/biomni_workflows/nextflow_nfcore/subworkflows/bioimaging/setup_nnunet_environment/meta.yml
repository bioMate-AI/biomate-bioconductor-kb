name: "setup_nnunet_environment"
description: "Bioimaging helper: setup_nnunet_environment"
keywords:
  - bioimaging
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: results_folder
    type: string
    description: Parameter results_folder
  - name: raw_data_base
    type: string
    description: Parameter raw_data_base
  - name: preprocessed
    type: string
    description: Parameter preprocessed

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
