name: "perform_facs_cell_sorting"
description: "Performs Fluorescence-Activated Cell Sorting (FACS) to enrich cell populations based on fluorescence characteristics."
keywords:
  - cell_biology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: cell_suspension_data
    type: string
    description: Parameter cell_suspension_data
  - name: fluorescence_parameter
    type: string
    description: Parameter fluorescence_parameter
  - name: threshold_min
    type: string
    description: Parameter threshold_min
  - name: threshold_max
    type: string
    description: Parameter threshold_max

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
