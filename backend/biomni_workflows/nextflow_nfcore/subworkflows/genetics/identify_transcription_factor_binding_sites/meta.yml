name: "identify_transcription_factor_binding_sites"
description: "Identifies binding sites for a specific transcription factor in a genomic sequence."
keywords:
  - genetics
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: sequence
    type: string
    description: Parameter sequence
  - name: tf_name
    type: string
    description: Parameter tf_name
  - name: output_file
    type: string
    description: Parameter output_file

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
