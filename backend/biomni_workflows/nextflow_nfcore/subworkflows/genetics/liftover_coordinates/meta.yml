name: "liftover_coordinates"
description: "liftover_coordinates function"
keywords:
  - genetics
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: chromosome
    type: string
    description: Parameter chromosome
  - name: position
    type: string
    description: Parameter position
  - name: input_format
    type: string
    description: Parameter input_format
  - name: output_format
    type: string
    description: Parameter output_format
  - name: data_path
    type: string
    description: Parameter data_path

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
