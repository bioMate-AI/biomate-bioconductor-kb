- name: "analyze_comparative_genomics_and_haplotypes test"
  command: nextflow run ./main.nf -profile docker
  params:
    # Uses inline-generated mock FASTA files (reference + 2 samples)
    sample_fasta_files: '["sample1.fasta", "sample2.fasta"]'
    reference_genome_path: 'reference.fasta'
    output_dir: './output'
  tags:
    - genomics
    - analyze_comparative_genomics_and_haplotypes
  notes:
    - "Mock FASTA files are created inline in main.nf"
    - "Sample2 has 1 variant (AT->TT at end) compared to reference"
