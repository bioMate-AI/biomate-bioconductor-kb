- name: "gene_set_enrichment_analysis test"
  command: nextflow run ./main.nf -profile docker
  params:
    # Cell cycle related genes for enrichment analysis
    genes: '["CCNA2", "CCNB1", "CDK1", "CDK2", "TP53", "RB1", "E2F1", "PCNA", "MCM2", "CDC6"]'
    top_k: 10
    database: 'ontology'
    background_list: null
    plot: 'false'
  tags:
    - genomics
    - gene_set_enrichment_analysis
