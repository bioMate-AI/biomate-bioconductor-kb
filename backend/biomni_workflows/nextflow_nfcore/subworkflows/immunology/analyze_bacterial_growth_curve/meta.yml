name: "analyze_bacterial_growth_curve"
description: "Analyzes bacterial growth curve data to determine growth parameters."
keywords:
  - immunology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: time_points
    type: string
    description: Parameter time_points
  - name: od_values
    type: string
    description: Parameter od_values
  - name: strain_name
    type: string
    description: Parameter strain_name

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
