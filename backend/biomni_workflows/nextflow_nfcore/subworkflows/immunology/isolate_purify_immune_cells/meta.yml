name: "isolate_purify_immune_cells"
description: "Simulates the isolation and purification of immune cells from tissue samples."
keywords:
  - immunology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: tissue_type
    type: string
    description: Parameter tissue_type
  - name: target_cell_type
    type: string
    description: Parameter target_cell_type
  - name: macs_antibody
    type: string
    description: Parameter macs_antibody

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
