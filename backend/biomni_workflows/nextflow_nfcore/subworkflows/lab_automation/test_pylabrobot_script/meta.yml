name: "test_pylabrobot_script"
description: "test_pylabrobot_script function"
keywords:
  - lab_automation
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: script_input
    type: string
    description: Parameter script_input
  - name: enable_tracking
    type: string
    description: Parameter enable_tracking
  - name: save_test_report
    type: string
    description: Parameter save_test_report
  - name: test_report_dir
    type: string
    description: Parameter test_report_dir

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
