- name: "analyze_arsenic_speciation_hplc_icpms test"
  command: nextflow run ./main.nf -profile docker
  params:
    # HPLC-ICP-MS chromatogram data: sample_id -> {retention_time: intensity}
    sample_data: '{"Sample_A": {"2.8": 1250, "7.5": 3400, "5.3": 890}, "Sample_B": {"2.8": 980, "7.5": 2100, "5.3": 1450}}'
    sample_name: 'Environmental_Water_Sample'
    calibration_data: null
  tags:
    - microbiology
    - analyze_arsenic_speciation_hplc_icpms
  notes:
    - "Retention times are strings in JSON but converted to floats in main.nf"
    - "2.8=As(III), 7.5=As(V), 5.3=DMAs(V) based on standard retention times"
