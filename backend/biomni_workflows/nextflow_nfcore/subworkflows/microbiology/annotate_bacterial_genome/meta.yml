name: "annotate_bacterial_genome"
description: "Annotate a bacterial genome using Prokka to identify genes, proteins, and functional features."
keywords:
  - microbiology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: genome_file_path
    type: string
    description: Parameter genome_file_path
  - name: genus
    type: string
    description: Parameter genus
  - name: species
    type: string
    description: Parameter species
  - name: strain
    type: string
    description: Parameter strain
  - name: prefix
    type: string
    description: Parameter prefix

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
