name: "simulate_generalized_lotka_volterra_dynamics"
description: "Simulate microbial community dynamics using the Generalized Lotka-Volterra (gLV) model."
keywords:
  - microbiology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: initial_abundances
    type: string
    description: Parameter initial_abundances
  - name: growth_rates
    type: string
    description: Parameter growth_rates
  - name: interaction_matrix
    type: string
    description: Parameter interaction_matrix
  - name: time_points
    type: string
    description: Parameter time_points

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
