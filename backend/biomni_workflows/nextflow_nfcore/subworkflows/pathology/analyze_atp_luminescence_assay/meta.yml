name: "analyze_atp_luminescence_assay"
description: "Analyze luminescence-based ATP assay data to determine intracellular ATP concentration."
keywords:
  - pathology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: data_file
    type: string
    description: Parameter data_file
  - name: standard_curve_file
    type: string
    description: Parameter standard_curve_file
  - name: normalization_data
    type: string
    description: Parameter normalization_data

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
