- name: "analyze_intracellular_calcium_with_rhod2 test"
  command: nextflow run ../main.nf -profile docker
  params:
    # Uses inline-generated mock images (created in script)
    background_image_path: "mock_background.png"
    control_image_path: "mock_control.png"
    sample_image_path: "mock_sample.png"
    output_dir: "./output"
  tags:
    - pathology
    - analyze_intracellular_calcium_with_rhod2
  notes:
    - "Mock images are created inline simulating Rhod-2 calcium imaging"
    - "Background: low noise, Control: baseline calcium, Sample: elevated calcium"
