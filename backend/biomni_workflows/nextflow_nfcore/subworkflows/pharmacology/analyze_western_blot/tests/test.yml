- name: "analyze_western_blot test"
  command: nextflow run ../main.nf -profile docker
  params:
    # Uses inline-generated mock Western blot image
    blot_image_path: "mock_western_blot.png"
    target_bands: '[{"name": "p53", "roi": [50, 30, 100, 40]}, {"name": "EGFR", "roi": [50, 90, 100, 40]}]'
    loading_control_band: '{"name": "GAPDH", "roi": [50, 150, 100, 40]}'
    antibody_info: '{"primary": {"name": "anti-p53 rabbit polyclonal", "dilution": "1:1000"}, "secondary": {"name": "anti-rabbit HRP", "dilution": "1:5000"}}'
  tags:
    - pharmacology
    - analyze_western_blot
  notes:
    - "Mock Western blot image is created inline simulating protein bands"
