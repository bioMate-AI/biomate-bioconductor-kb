name: "run_diffdock_with_smiles"
description: "* nf-core style module generated from tested Galaxy wrapper"
keywords:
  - pharmacology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: pdb_path
    type: string
    description: Parameter pdb_path
  - name: smiles_string
    type: string
    description: Parameter smiles_string
  - name: local_output_dir
    type: string
    description: Parameter local_output_dir

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
