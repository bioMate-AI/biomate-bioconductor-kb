name: "analyze_fatty_acid_composition_by_gc"
description: "Analyzes fatty acid composition in tissue samples using gas chromatography data."
keywords:
  - physiology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: gc_data_file
    type: string
    description: Parameter gc_data_file
  - name: tissue_type
    type: string
    description: Parameter tissue_type
  - name: sample_id
    type: string
    description: Parameter sample_id

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
