- name: "analyze_protein_colocalization test"
  command: nextflow run ../main.nf -profile docker
  params:
    # Uses inline-generated mock fluorescence images
    channel1_path: "mock_channel1_green.png"
    channel2_path: "mock_channel2_red.png"
    output_dir: "./output"
    threshold_method: "otsu"
  tags:
    - physiology
    - analyze_protein_colocalization
  notes:
    - "Mock images simulating two fluorescent proteins with ~70% colocalization"
    - "Channel 1: punctate green pattern, Channel 2: partially overlapping red pattern"
