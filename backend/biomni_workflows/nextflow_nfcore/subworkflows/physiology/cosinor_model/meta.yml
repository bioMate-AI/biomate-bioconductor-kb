name: "cosinor_model"
description: "Cosinor: y = mesor + amplitude * cos(2*pi*(t-acrophase)/period)"
keywords:
  - physiology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: t
    type: string
    description: Parameter t
  - name: mesor
    type: string
    description: Parameter mesor
  - name: amplitude
    type: string
    description: Parameter amplitude
  - name: acrophase
    type: string
    description: Parameter acrophase

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
