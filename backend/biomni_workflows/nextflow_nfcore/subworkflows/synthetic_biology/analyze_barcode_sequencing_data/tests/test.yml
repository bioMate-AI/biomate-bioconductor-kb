- name: "analyze_barcode_sequencing_data test"
  command: nextflow run ./main.nf -profile docker
  params:
    # Uses inline-generated FASTA file with barcoded sequences (created in main.nf)
    input_file: 'test_barcodes.fasta'
    barcode_pattern: 'ATCG[ATCG]{8}GCTA'
    flanking_seq_5prime: 'ATCG'
    flanking_seq_3prime: 'GCTA'
    min_count: '2'
    output_dir: './results'
  tags:
    - synthetic_biology
    - analyze_barcode_sequencing_data
  notes:
    - "Test FASTA file is created inline in main.nf with mock barcoded sequences"
    - "Contains 3 unique barcodes with varying frequencies"
