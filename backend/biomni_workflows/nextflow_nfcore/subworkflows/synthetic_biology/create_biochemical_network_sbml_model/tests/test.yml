- name: "create_biochemical_network_sbml_model test"
  command: nextflow run ./main.nf -profile docker
  params:
    # Simple enzymatic reaction network (A + E <-> AE -> P + E)
    reaction_network: '[{"id": "binding", "name": "Substrate Binding", "reactants": {"A": 1, "E": 1}, "products": {"AE": 1}, "reversible": true}, {"id": "catalysis", "name": "Catalysis", "reactants": {"AE": 1}, "products": {"P": 1, "E": 1}, "reversible": false}]'
    kinetic_parameters: '{"binding": {"law_type": "mass_action", "parameters": {"k_on": 0.1, "k_off": 0.01}}, "catalysis": {"law_type": "mass_action", "parameters": {"k_cat": 0.5}}}'
    output_file: 'biochemical_model.xml'
  tags:
    - synthetic_biology
    - create_biochemical_network_sbml_model
