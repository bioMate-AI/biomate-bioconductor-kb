name: "identify_fas_functional_domains"
description: "Identifies functional domains within a Fatty Acid Synthase (FAS) sequence and predicts their roles."
keywords:
  - synthetic_biology
  - biomni
tools:
  - biomni:
      description: "Biomni bioinformatics tool library"
      homepage: "https://github.com/biomate/biomni"
      documentation: "https://github.com/biomate/biomni"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - name: sequence
    type: string
    description: Parameter sequence

output:
  - results:
      type: tuple
      description: JSON results file
      pattern: "*_results.json"
  - output:
      type: tuple
      description: Human-readable output
      pattern: "*_output.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@biomni"
maintainers:
  - "@biomni"
