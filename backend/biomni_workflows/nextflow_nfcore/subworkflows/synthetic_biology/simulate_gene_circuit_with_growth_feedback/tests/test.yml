- name: "simulate_gene_circuit_with_growth_feedback test"
  command: nextflow run ./main.nf -profile docker
  params:
    # Toggle switch circuit (2 mutually repressing genes)
    circuit_topology: '[[0, -1], [-1, 0]]'
    kinetic_params: '{"basal_rates": [0.1, 0.1], "degradation_rates": [0.05, 0.05], "hill_coefficients": [2.0, 2.0], "threshold_constants": [0.5, 0.5]}'
    growth_params: '{"max_growth_rate": 0.02, "growth_inhibition": 0.01, "gene_growth_weights": [0.3, 0.3]}'
    simulation_time: '100'
    time_points: '1000'
  tags:
    - synthetic_biology
    - simulate_gene_circuit_with_growth_feedback
  notes:
    - "circuit_topology is converted from JSON list to numpy array in main.nf"
