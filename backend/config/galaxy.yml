galaxy:
  # Enable AI Assistant
  enable_ai_assistant: true

  # Enable Interactive Tools (Jupyter, RStudio, CellxGene)
  # interactivetools_upstream_proxy: true means the upstream nginx/proxy handles routing
  # so Galaxy does not need a separate gx-it-proxy process
  interactivetools_enable: true
  interactivetools_upstream_proxy: true

  # Claude Sonnet 4.5 Configuration (Primary)
  ai_llm_provider: anthropic
  ai_llm_model: claude-sonnet-4-5
  # API key read from ANTHROPIC_API_KEY environment variable (see lib/galaxy/config/ai_config.py)

  # HTTP Server Configuration
  http: 0.0.0.0:8081

  # Basic Galaxy settings
  admin_users: admin@galaxy.org
  bootstrap_admin_api_key: e5b2a0e7e843b203ec49ec9a5b1a2dbfab20f92e72651410f29bd7b2101467b3
  # Allow admin to access all histories and run as other users
  allow_user_impersonation: true
  expose_potentially_sensitive_api_actions: true
  database_connection: sqlite:///./database/universe.sqlite?isolation_level=IMMEDIATE
  file_path: files
  new_file_path: tmp
  tool_dependency_dir: dependencies
  check_migrate_tools: false
  # Include standard Galaxy tools, Biomni tools, and Biomate AI tools
  # Use absolute paths for custom tools
  tool_config_file: tool_conf.xml.sample,/Users/kky/biomate/backend/biomni_workflows/galaxy/tools/biomni/tool_conf_biomni.xml

  # Memory optimization - load tools on demand instead of preloading
  preload_tool_panel: false

  # Job configuration - use Docker container for tool execution
  # See job_conf.yml for details on biomate/biotools:arm64 container
  job_config_file: config/job_conf.yml

  # Data source plugins for /api/data/browse and the browse_data MCP tool.
  # Lists public biological databases (EBI FTP, NCBI FTP, Ensembl FTP, HTTP).
  file_sources_config_file: config/file_sources_conf.yml

gravity:
  gunicorn:
    # Bind to 8080 inside the container; Docker port-maps host:8081 → container:8080.
    # Binding to 8081 here causes the port-forward to receive "Connection reset"
    # because gunicorn isn't listening on 8080.
    bind: 0.0.0.0:8080
    # 4 workers keeps API responsive while one is doing a long synchronous
    # operation (LLM routing call, NF subprocess launch, S3 staging in
    # /api/nextflow/execute). With workers=1 a single slow request blocked
    # /api/version and Docker marked the container unhealthy. The 512MB
    # heap cap added to NXF_OPTS keeps total memory ~2GB for 4 workers,
    # well within dev's 8GB. Bump to 8 on a 16GB+ host.
    workers: 4
    # Increase timeout for AI operations
    timeout: 300
    # Limit memory per worker
    worker_class: sync
    max_requests: 1000
    max_requests_jitter: 50
    # Do NOT preload app - load toolbox per worker to reduce memory
    preload: false
    # Environment variables for AI Assistant
    environment:
      PYTHONPATH: '/app/lib'
      ANTHROPIC_API_KEY: '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'
      OPENAI_API_KEY: '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'
      GITHUB_TOKEN: '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'
