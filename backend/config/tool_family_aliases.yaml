# Family-key alias map — Phase 1.5 clustering refinement.
#
# Maps fragment family_keys to a canonical family_key. Built from the A/B
# failure cases in 20260518_PHASE1_AB_RESULTS_AND_DECISION.md plus inspection
# of fragments in the canonical DB.
#
# Format:
#   <canonical_family_key>:
#     - <fragment_family_key_1>
#     - <fragment_family_key_2>
#
# Rules of thumb:
#   - Only merge when the fragments are *the same tool*, not different
#     tools that share a substring. (e.g. STAR aligner vs star_fusion are
#     DIFFERENT tools — do NOT merge.)
#   - Keep major-version distinctions when the user would care (MACS2 vs
#     MACS3 are materially different; metaphlan2 vs metaphlan4 are
#     different release lineages).
#   - Merge author/distributor prefixes: naturalis_, ribogalaxy_, rmarkdown_,
#     phe_, qiime2__<tool>__<variant>, etc.

