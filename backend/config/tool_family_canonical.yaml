trinity: toolshed.g2.bx.psu.edu/repos/iuc/trinity/trinity/2.15.1+galaxy1

# ─── Toolkit suites — canonical = most-asked sub-function ─────────────
# Samtools: `sort` is the most common entry point in pipelines
samtools: toolshed.g2.bx.psu.edu/repos/devteam/samtools_sort/samtools_sort/2.0.8
# Picard: MarkDuplicates is the canonical "what does Picard do" answer
picard: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_MarkDuplicates/3.1.1.0
# BCFtools: view is the most-asked, mpileup also very common
bcftools: toolshed.g2.bx.psu.edu/repos/iuc/bcftools/bcftools_view/0.1.19.0
# Bedtools: intersectbed is the canonical "interval ops" entry
bedtools: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_intersect_intervals/2.31.1+galaxy0
# GATK4: HaplotypeCaller is the canonical variant-calling entry
gatk4: nfcore/gatk4/haplotypecaller
# EMBOSS: needle pairwise align is the most-recognized
emboss: toolshed.g2.bx.psu.edu/repos/iuc/emboss_needle/emboss_needle/6.6.0+galaxy0
# STAR aligner: align is canonical
star: nfcore/star/align

