# Nginx configuration for BioMate Interactive Tools
# Single entry point routing to all services

upstream jupyter {
    server 127.0.0.1:8888;
}

upstream rstudio {
    server 127.0.0.1:8787;
}

upstream cellxgene {
    server 127.0.0.1:5005;
}

upstream shiny {
    server 127.0.0.1:3838;
}

server {
    listen 80 default_server;
    server_name _;

    # Main landing page
    location = / {
        return 302 /hub;
    }

    # Hub - service selection page
    location /hub {
        alias /var/www/html/hub;
        index index.html;
    }

    # Jupyter Lab
    location /jupyter {
        proxy_pass http://jupyter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # RStudio
    location /rstudio/ {
        rewrite ^/rstudio/(.*)$ /$1 break;
        proxy_pass http://rstudio;
        proxy_redirect http://rstudio/ $scheme://$host/rstudio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # CellxGene
    location /cellxgene {
        proxy_pass http://cellxgene;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Shiny/Pavian
    location /shiny/ {
        rewrite ^/shiny/(.*)$ /$1 break;
        proxy_pass http://shiny;
        proxy_redirect / /shiny/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static data files (for iobio, etc.)
    location /data/ {
        alias /import/;
        autoindex on;
        add_header Access-Control-Allow-Origin *;
    }

    # Shared output files
    location /export/ {
        alias /export/;
        autoindex on;
    }
}
