# Nginx configuration for BioMate Interactive Tools
# Comprehensive routing for all interactive tools

upstream jupyter {
    server 127.0.0.1:8888;
}

upstream rstudio {
    server 127.0.0.1:8787;
}

upstream cellxgene {
    server 127.0.0.1:5005;
}

upstream shiny {
    server 127.0.0.1:3838;
}

upstream openrefine {
    server 127.0.0.1:3333;
}

upstream ethercalc {
    server 127.0.0.1:8000;
}

upstream higlass {
    server 127.0.0.1:8989;
}

upstream isee {
    server 127.0.0.1:7777;
}

server {
    listen 80 default_server;
    server_name _;

    # Main landing page
    location = / {
        return 302 /hub;
    }

    # Hub - service selection page
    location /hub {
        alias /var/www/html/hub;
        index index.html;
    }

    # Jupyter Lab
    location /jupyter {
        proxy_pass http://jupyter;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # RStudio
    location /rstudio/ {
        rewrite ^/rstudio/(.*)$ /$1 break;
        proxy_pass http://rstudio;
        proxy_redirect http://rstudio/ $scheme://$host/rstudio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # CellxGene (single-cell visualization)
    location /cellxgene/ {
        rewrite ^/cellxgene/(.*)$ /$1 break;
        proxy_pass http://cellxgene;
        proxy_redirect / /cellxgene/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /cellxgene {
        return 302 /cellxgene/;
    }

    # Shiny/Pavian (metagenomics)
    location /shiny/ {
        rewrite ^/shiny/(.*)$ /$1 break;
        proxy_pass http://shiny;
        proxy_redirect / /shiny/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /shiny {
        return 302 /shiny/;
    }

    # OpenRefine (data cleaning)
    location /openrefine/ {
        rewrite ^/openrefine/(.*)$ /$1 break;
        proxy_pass http://openrefine;
        proxy_redirect / /openrefine/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /openrefine {
        return 302 /openrefine/;
    }

    # EtherCalc (collaborative spreadsheet)
    location /ethercalc/ {
        rewrite ^/ethercalc/(.*)$ /$1 break;
        proxy_pass http://ethercalc;
        proxy_redirect / /ethercalc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /ethercalc {
        return 302 /ethercalc/;
    }

    # HiGlass (Hi-C visualization)
    location /higlass/ {
        rewrite ^/higlass/(.*)$ /$1 break;
        proxy_pass http://higlass;
        proxy_redirect / /higlass/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /higlass {
        return 302 /higlass/;
    }

    # iSEE (SummarizedExperiment explorer)
    location /isee/ {
        rewrite ^/isee/(.*)$ /$1 break;
        proxy_pass http://isee;
        proxy_redirect / /isee/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /isee {
        return 302 /isee/;
    }

    # Static data files (for iobio, etc.)
    location /data/ {
        alias /import/;
        autoindex on;
        add_header Access-Control-Allow-Origin *;
    }

    # Shared output files
    location /export/ {
        alias /export/;
        autoindex on;
    }
}
