# Static tool-to-container mappings for Galaxy tools
# Used when BioContainers API is not available
# For Galaxy built-in utilities, use galaxy-tool-util container
# For QIIME2 tools, use official qiime2/core image from quay.io

tools:
  # Collection element identifiers - Galaxy built-in utility
  # Uses galaxy-tool-util which has Galaxy's utility scripts
  "toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.2":
    image: "quay.io/biocontainers/galaxy-tool-util"
    tag: "21.9.1--pyhdfd78af_0"
    registry: "quay.io/biocontainers"
    command: ["python"]
    working_dir: "/data"

  # Regex Find and Replace - basic text processing with sed
  "toolshed.g2.bx.psu.edu/repos/galaxyp/regex_find_replace/regex1/1.0.3":
    image: "quay.io/biocontainers/galaxy-tool-util"
    tag: "21.9.1--pyhdfd78af_0"
    registry: "quay.io/biocontainers"
    command: ["python"]
    working_dir: "/data"

  # Relabel identifiers - Galaxy collection operation
  "__RELABEL_FROM_FILE__":
    image: "quay.io/biocontainers/galaxy-tool-util"
    tag: "21.9.1--pyhdfd78af_0"
    registry: "quay.io/biocontainers"
    command: ["python"]
    working_dir: "/data"

  # QIIME2 tools import - use official QIIME2 image
  "toolshed.g2.bx.psu.edu/repos/q2d2/qiime2_core__tools__import/qiime2_core__tools__import/2023.5.0+dist.h193f7cc9.3":
    image: "quay.io/qiime2/core"
    tag: "2023.5"
    registry: "quay.io"
    command: ["/bin/bash", "-c"]
    working_dir: "/data"

  # QIIME2 demux summarize
  "toolshed.g2.bx.psu.edu/repos/q2d2/qiime2__demux__summarize/qiime2__demux__summarize/2023.5.0+q2galaxy.2023.5.0.2":
    image: "quay.io/qiime2/core"
    tag: "2023.5"
    registry: "quay.io"
    command: ["/bin/bash", "-c"]
    working_dir: "/data"
