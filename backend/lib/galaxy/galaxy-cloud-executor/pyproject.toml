[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-cloud-executor"
dynamic = ["version"]
description = "A multi-cloud executor module for Galaxy, inspired by Nextflow's cloud integration patterns"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Galaxy Cloud Team", email = "admin@galaxyproject.org"}
]
maintainers = [
    {name = "Galaxy Cloud Team", email = "admin@galaxyproject.org"}
]
keywords = ["galaxy", "cloud", "aws", "azure", "gcp", "kubernetes", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.0.0",
    "structlog>=23.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.26.0",
    "aioboto3>=11.0.0",
]
azure = [
    "azure-batch>=14.0.0",
    "azure-storage-blob>=12.14.0",
    "azure-identity>=1.12.0",
    "azure-mgmt-batch>=17.0.0",
]
gcp = [
    "google-cloud-batch>=0.15.0",
    "google-cloud-storage>=2.7.0",
    "google-auth>=2.16.0",
    "google-api-python-client>=2.70.0",
]
k8s = [
    "kubernetes>=25.0.0",
    "kubernetes-asyncio>=25.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
all = [
    "galaxy-cloud-executor[aws,azure,gcp,k8s]"
]

[project.urls]
Homepage = "https://github.com/galaxyproject/galaxy-cloud-executor"
Repository = "https://github.com/galaxyproject/galaxy-cloud-executor.git"
Documentation = "https://galaxy-cloud-executor.readthedocs.io"
"Bug Tracker" = "https://github.com/galaxyproject/galaxy-cloud-executor/issues"

[project.scripts]
galaxy-cloud = "galaxy_cloud.cli:main"

[tool.setuptools]
packages = ["galaxy_cloud"]

[tool.setuptools_scm]
write_to = "galaxy_cloud/_version.py"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["galaxy_cloud"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "aws: marks tests as AWS-specific",
    "azure: marks tests as Azure-specific",
    "gcp: marks tests as GCP-specific",
    "k8s: marks tests as Kubernetes-specific",
]

[tool.coverage.run]
source = ["galaxy_cloud"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]