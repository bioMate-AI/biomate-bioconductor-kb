# BioMate deploy-managed compose file.
#
# Pulled to /opt/biomate/docker-compose.deploy.yml on each target host by
# scripts/deploy.sh. Uses ECR `image:` refs (NOT `build:`) so deploys never
# rebuild — they just pull the tag baked by the GHA image-build workflow.
#
# Two env vars must be set when running `docker compose up`:
#   BACKEND_IMAGE    e.g. 399683337364.dkr.ecr.us-west-2.amazonaws.com/biomate/dev-backend:sha-27999805f8e3
#   FRONTEND_IMAGE   e.g. 399683337364.dkr.ecr.us-west-2.amazonaws.com/biomate/dev-frontend:sha-b8980d6a1a4d
#
# Container names use a `-deploy` suffix so they cannot collide with the
# sync_to_dev.sh-managed dev containers during the migration window (P4.3
# retires the sync containers once deploy.sh has proven itself).
#
# Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.) come from /opt/biomate/.env
# on the host, which scripts/deploy.sh (Step 2) materializes from AWS Secrets
# Manager (<env>/biomate/galaxy-env) via the EC2 instance role on every deploy.

services:
  galaxy-backend-deploy:
    image: ${BACKEND_IMAGE}
    container_name: biomate-galaxy-deploy
    pull_policy: always
    ports:
      - "8081:8080"
    # env_file: every KEY=VAL in /opt/biomate/.env is injected into the
    # container env. deploy.sh writes Secrets-Manager-sourced values there
    # (DB URL, BILLING_INTERNAL_KEY, LAGO_*, REDIS_URL, JAVA_BILLING_*).
    # Without this, those vars are only available for compose variable
    # substitution, not as container env — so Galaxy crashes at billing
    # module import (BILLING_INTERNAL_KEY required).
    env_file:
      - /opt/biomate/.env
    environment:
      - PYTHONUNBUFFERED=1
      - GALAXY_CONFIG_FILE=/app/config/galaxy.yml
      # Where the backend POSTs SSE/progress events (/internal/sse-inject) so
      # biomate_session streaming works. The frontend is a SEPARATE container —
      # the backend's localhost is NOT the frontend, so the unset default
      # (localhost:5000/3000) → Connection refused → "fetch failed". Point it at
      # the frontend's name on biomate-deploy-net (same pattern as the frontend's
      # GALAXY_API_URL=http://galaxy-backend-deploy:8080). /internal/ is exempt
      # from the frontend's HTTPS redirect so this plain-HTTP call isn't 301'd.
      - FRONTEND_URL=http://biomate-frontend-deploy:3000
      # Route ALL workflow runs to AWS Batch (design: every production workflow
      # runs on Batch). Without this the backend defaults to the LOCAL executor,
      # which lacks baked tool modules (e.g. rdkit) → "Missing required runtime
      # modules" 503 on hERG/ADMET. Was previously only in the host .env on test;
      # baked here so test/prod can't silently drift back to local execution.
      - NEXTFLOW_USE_AWS=true
      # Persist in-flight run state in Redis so records survive gunicorn worker
      # recycles (workers:1, max_requests recycles often) — otherwise a completed
      # run's record (incl. s3_output_files) vanishes and /api/invocations/:id/
      # outputs → analyze_results return empty. Falls back to InMemory gracefully
      # if REDIS_URL is unset/unreachable (get_run_state_store pings first). The
      # L3 fix from docs/20260615_RUNS_PERSISTENCE_DESIGN.md.
      - RUN_STATE_STORE=redis
    # Persist ONLY the workflow catalog (galaxy_ai_tools.db, ~279MB, ~2600
    # workflows) across container recreates via a single-file bind-mount. The
    # catalog is NOT baked into the image (the image ships only a 20KB stub),
    # so without this every `deploy.sh` recreate reverts the catalog to the stub
    # → routing fails with "no such table: workflows".
    #
    # IMPORTANT: bind-mount the single FILE, not the whole /app/database dir.
    # /app/database also holds Galaxy's gravity/ process-manager runtime state
    # (supervisor sockets, pids); persisting that whole dir across recreates
    # leaves stale gravity state that breaks Galaxy startup on the 2nd recreate
    # (container goes unhealthy). Keeping gravity/cache ephemeral = clean boots.
    #
    # The host file is seeded once per host from
    # s3://biomate-nextflow-work/dev-sync/galaxy_ai_tools.db. If it is absent,
    # Docker creates an empty dir at the target → sqlite "unable to open" →
    # search degrades to no-results, but Galaxy still boots healthy (safe).
    # Seed/refresh recipe: docs/20260625_TEST_WORKFLOW_CATALOG_EMPTY_ROOTCAUSE.md.
    #
    # Second mount: the nextflow_nfcore workflow DEFINITIONS (.nf/.config). These
    # are excluded from the backend image (.dockerignore: "indexed separately"),
    # and on dev they're seeded into the container by sync_to_dev.sh step 4 —
    # deploy.sh-based envs (test/prod) don't run that, so without this mount the
    # ~2600 catalog workflows (incl drug_discovery/cyp_ddi_panel) route + show a
    # card but lazy-load 0 steps (the steps parser reads the .nf from disk).
    # This is ADDITIVE: the image's /app/biomni_workflows has no nextflow_nfcore/
    # subdir, so the mount adds it without shadowing nextflow/ or
    # nextflow_generated/. Host dir seeded once (def-only bundle, ~5MB) from the
    # repo's backend/biomni_workflows/nextflow_nfcore. Absent host dir → empty
    # mountpoint → 0 steps (same as today), never breaks boot.
    volumes:
      - /opt/biomate/data/galaxy_ai_tools.db:/app/database/galaxy_ai_tools.db
      - /opt/biomate/data/nextflow_nfcore:/app/biomni_workflows/nextflow_nfcore
      # Prebuilt BGE workflow-embeddings index (dense retrieval). Keyed to the
      # catalog's content signature — built once offline against the catalog above
      # (~2632 workflows, 3.7MB) and persisted on the host. With it,
      # _ensure_workflow_embeddings() LOADS in ~2s at boot; WITHOUT it, the first
      # request per worker triggers a ~4-min _build (and re-builds on every worker
      # recycle → churn). Rebuild this file whenever galaxy_ai_tools.db changes
      # (else the staleness check rebuilds it once at runtime). Absent host file →
      # Docker makes a dir → load fails gracefully → BGE stays disabled (FTS still
      # works), never breaks boot.
      - /opt/biomate/data/galaxy_ai_workflow_embeddings.npz:/app/database/galaxy_ai_workflow_embeddings.npz
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 900s
    networks: [biomate-deploy-net]

  frontend-deploy:
    image: ${FRONTEND_IMAGE}
    container_name: biomate-frontend-deploy
    pull_policy: always
    ports:
      # Host :80 is owned by the standalone Caddy container (ACME HTTP-01
      # challenge + redirect to :443). Frontend listens on :3000 only;
      # Caddy reverse-proxies localhost:3000 -> internal Express server.
      - "3000:3000"
    env_file:
      - /opt/biomate/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GALAXY_API_URL=http://galaxy-backend-deploy:8080
      # Must match the backend: makes the frontend send the AWS-Batch profile
      # (not 'standard'/local) and stage local file params to S3 before dispatch.
      # The backend also force-overrides to awsbatch, but keeping them in sync
      # avoids 'standard' leaking into runs that bypass that override.
      - NEXTFLOW_USE_AWS=true
    depends_on:
      galaxy-backend-deploy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The app force-redirects HTTP->HTTPS in production, so a plain-HTTP probe
      # gets a 301 (not 200) and the container is wrongly marked unhealthy. Send
      # X-Forwarded-Proto: https (as Caddy does) so /api/health returns 200.
      test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/api/health',headers:{'X-Forwarded-Proto':'https'}}, (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [biomate-deploy-net]

networks:
  biomate-deploy-net:
    name: biomate-deploy-net
    driver: bridge
