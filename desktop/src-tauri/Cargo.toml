[package]
name = "biomate-desktop"
version = "0.1.0"
description = "BioMate Desktop — AI-powered biomedical research platform"
authors = ["BioMate AI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "biomate_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "biomate-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"          # encrypted local KV store (replaces raw keychain)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enables custom protocol for asset loading in production builds
custom-protocol = ["tauri/custom-protocol"]
