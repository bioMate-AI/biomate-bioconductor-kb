# BioMate On-Premises Deployment
#
# Quick start:
#   1. cp .env.onprem.example .env
#   2. Edit .env — set POSTGRES_PASSWORD, JWT_SECRET, SESSION_SECRET, LLM provider key
#   3. docker compose -f docker-compose.onprem.yml up -d
#   4. Wait ~2 min for workflow DB download + services to start
#   5. Create first admin: bash scripts/create-first-admin.sh admin@company.com MyPassword
#   6. Open http://localhost:5000
#
# Images are pulled from GHCR (ghcr.io/biomate-ai/) — no build from source needed.
# Override with BIOMATE_BACKEND_IMAGE / BIOMATE_FRONTEND_IMAGE in .env.
#
# Workflow catalog (~280MB) is downloaded once by the db-init container on first start.
# Air-gapped deployments: set BIOMATE_DB_URL to a local file server URL.
#
# To enable HTTPS (recommended):
#   Uncomment the `caddy` service; see caddy/Caddyfile.example for domain config.
#
# To enable Ollama (local LLM, no internet required):
#   Uncomment the `ollama` service and set GALAXY_AI_LLM_PROVIDER=ollama in .env.
#
# Billing (Stripe) is disabled by default for on-prem.
# Set STRIPE_SECRET_KEY to enable subscription gating.

services:
  # ── PostgreSQL (user/auth database) ────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: biomate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biomate}
      POSTGRES_USER: ${POSTGRES_USER:-biomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - biomate-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biomate} -d ${POSTGRES_DB:-biomate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - biomate-network
    # PostgreSQL is NOT exposed to host by default — internal only.
    # Uncomment below only for local development/debugging:
    # ports:
    #   - "127.0.0.1:5432:5432"

  # ── Redis (run-state store, optional but recommended) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: biomate-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - biomate-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biomate-network

  # ── Workflow DB initializer ────────────────────────────────────────────────
  # Downloads galaxy_ai_tools.db (the 2,455-workflow catalog) into the
  # biomate-backend-db volume on first boot.  On subsequent starts the file
  # already exists and the container exits immediately.
  # Set BIOMATE_DB_URL to override the download source (useful for air-gapped
  # deployments where you pre-download and supply the file via a local HTTP
  # server or file:// mount).
  db-init:
    image: curlimages/curl:latest
    container_name: biomate-db-init
    volumes:
      - biomate-backend-db:/app/database
    environment:
      BIOMATE_DB_URL: ${BIOMATE_DB_URL:-https://biomate-onprem-assets.s3.us-west-2.amazonaws.com/onprem/galaxy_ai_tools.db}
    command: >
      sh -c '
        DB=/app/database/galaxy_ai_tools.db;
        MIN_SIZE=50000000;
        ACTUAL=$$(stat -c%s "$$DB" 2>/dev/null || echo 0);
        if [ "$$ACTUAL" -lt "$$MIN_SIZE" ]; then
          echo "[db-init] Downloading workflow catalog from $$BIOMATE_DB_URL ...";
          curl -fL --retry 3 --retry-delay 5 --progress-bar "$$BIOMATE_DB_URL" -o "$$DB"
          echo "[db-init] Done.";
        else
          echo "[db-init] Workflow catalog already present ($$(du -sh $$DB | cut -f1)). Skipping.";
        fi
      '
    restart: "no"
    networks:
      - biomate-network

  # ── Galaxy AI Backend ───────────────────────────────────────────────────────
  galaxy-backend:
    image: ${BIOMATE_BACKEND_IMAGE:-ghcr.io/biomate-ai/biomate-backend:latest}
    container_name: biomate-galaxy
    # Clear the image's ENTRYPOINT so `command` below runs as the process directly.
    # Without this, ENTRYPOINT=["/bin/sh"] + command=[gunicorn...] → /bin/sh gunicorn...,
    # which makes sh treat "gunicorn" as a script file and fails.
    entrypoint: []
    ports:
      - "127.0.0.1:8081:8080"   # internal only; Caddy/nginx proxies externally
    environment:
      PYTHONUNBUFFERED: "1"
      # galaxy.yml is .gitignore'd (per-install copy). Use the committed template
      # instead — it reads all secrets from env vars via GALAXY_CONFIG_OVERRIDE_*.
      GALAXY_CONFIG_FILE: /app/config/galaxy.yml.template

      # ── LLM Provider (choose one) ──────────────────────────────────────────
      # Option A: Anthropic Claude (requires internet + VPN in China)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Option B: DeepSeek (国内可直连)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

      # Option C: 智谱 GLM (国内可直连)
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}

      # Option D: OpenRouter (中转多模型，支持 DeepSeek/Qwen/Llama)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # Option E: Ollama (完全离线，取消下面 ollama service 的注释后使用)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}

      # Active provider — set to: anthropic / deepseek / zhipu / openrouter / ollama
      GALAXY_AI_LLM_PROVIDER: ${GALAXY_AI_LLM_PROVIDER:-anthropic}
      GALAXY_AI_LLM_MODEL: ${GALAXY_AI_LLM_MODEL:-}

      # ── Workflow execution ─────────────────────────────────────────────────
      # LOCAL mode: Nextflow runs tasks in Docker containers on this host.
      # AWS mode: tasks run on AWS Batch (requires AWS credentials below).
      NEXTFLOW_EXECUTOR: ${NEXTFLOW_EXECUTOR:-local}
      # Explicit disable — prevents the frontend default (executor="awsbatch")
      # from overriding local mode. Set to "true" only when using AWS Batch.
      NEXTFLOW_USE_AWS: ${NEXTFLOW_USE_AWS:-false}

      # ── AWS (optional, only needed for AWS Batch + S3 storage) ────────────
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}

      # ── Run-state persistence ──────────────────────────────────────────────
      RUN_STATE_STORE: redis
      REDIS_URL: redis://redis:6379

      # ── Local Nextflow work + output directory ─────────────────────────────
      # Must be on a persistent volume so outputs survive container restarts.
      # Change the left side of the volume mount below if you use a different path.
      NEXTFLOW_WORK_DIR: /app/nf-work

      # ── Galaxy bootstrap API key ───────────────────────────────────────────
      # Overrides the placeholder in galaxy.yml.template so every deployment
      # uses a unique key.  Must match GALAXY_API_KEY set in the frontend service.
      # Generate with: openssl rand -hex 32
      GALAXY_CONFIG_OVERRIDE_BOOTSTRAP_ADMIN_API_KEY: ${GALAXY_API_KEY}

      # ── On-premises license ────────────────────────────────────────────────
      # BIOMATE_LICENSE_KEY:   由 BioMate 团队签发，格式 BMOP-XXXX-XXXX-XXXX-XXXX
      # BIOMATE_LICENSE_SECRET: 由 BioMate 团队随部署包一并提供，勿自行修改
      BIOMATE_LICENSE_KEY: ${BIOMATE_LICENSE_KEY:-}
      BIOMATE_LICENSE_SECRET: ${BIOMATE_LICENSE_SECRET:-}
    volumes:
      - biomate-backend-db:/app/database      # workflow catalog SQLite
      - biomate-backend-logs:/app/logs
      - biomate-nf-work:/app/nf-work          # Nextflow work + output files (persistent)
      - ./backend/config:/app/config
      # Docker socket required for local Nextflow executor (NEXTFLOW_EXECUTOR=local).
      # Comment out if you use AWS Batch instead.
      - /var/run/docker.sock:/var/run/docker.sock
    command: [
      "gunicorn",
      "galaxy.webapps.galaxy.fast_factory:factory()",
      "--pythonpath", "lib",
      "-k", "galaxy.webapps.galaxy.workers.Worker",
      "--bind", "0.0.0.0:8080",
      "--workers", "1",
      "--timeout", "600",
      "--preload",
      "--log-level", "info"
    ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - biomate-network

  # ── Frontend (Node.js + React) ──────────────────────────────────────────────
  frontend:
    image: ${BIOMATE_FRONTEND_IMAGE:-ghcr.io/biomate-ai/biomate-frontend:latest}
    container_name: biomate-frontend
    ports:
      - "5000:3000"             # change left side to 80/443 behind a reverse proxy
    environment:
      NODE_ENV: production
      PORT: "3000"
      GALAXY_URL: http://galaxy-backend:8080
      GALAXY_API_KEY: ${GALAXY_API_KEY:-}

      DATABASE_URL: postgresql://${POSTGRES_USER:-biomate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biomate}
      REDIS_URL: redis://redis:6379

      # ── Secrets (required) ─────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}

      # ── LLM forwarding to Galaxy ───────────────────────────────────────────
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GALAXY_AI_LLM_PROVIDER: ${GALAXY_AI_LLM_PROVIDER:-anthropic}
      GALAXY_AI_LLM_MODEL: ${GALAXY_AI_LLM_MODEL:-}

      # ── Storage (optional AWS S3) ──────────────────────────────────────────
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}

      # ── Billing (disabled by default for on-prem) ──────────────────────────
      # Set STRIPE_SECRET_KEY to enable subscription management
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      BILLING_LAGO_ENABLED: "false"

      # ── Network ────────────────────────────────────────────────────────────
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # ── Workflow notifications ─────────────────────────────────────────────
      # Send email when a workflow finishes. Requires SMTP config above.
      # Values: never / always / on_failure
      WORKFLOW_NOTIFY: ${WORKFLOW_NOTIFY:-on_failure}

      # ── Internal keys ──────────────────────────────────────────────────────
      BILLING_INTERNAL_KEY: ${BILLING_INTERNAL_KEY:-onprem-billing-disabled}

      # ── Email / SMTP (optional) ───────────────────────────────────────────
      # For registration verification and workflow notifications.
      # Leave empty to skip email (verification token returned in API response).
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:5000}

      # ── On-premises mode ───────────────────────────────────────────────────
      # NOTE: VITE_ONPREM is a Vite build-time flag baked into the JS bundle
      # at Docker image build time (--build-arg VITE_ONPREM=true). It is NOT a
      # runtime env var — setting it here has no effect. The GHCR image
      # (ghcr.io/biomate-ai/biomate-frontend) is always built with VITE_ONPREM=true.
    depends_on:
      postgres:
        condition: service_healthy
      galaxy-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - biomate-network

  # ── Caddy (HTTPS / TLS termination — optional but recommended) ────────────
  # Uncomment to enable automatic HTTPS via Let's Encrypt.
  # Requirements:
  #   1. Copy caddy/Caddyfile.example → caddy/Caddyfile and set your domain.
  #   2. Point your DNS A record to this server.
  #   3. Set FORCE_HTTPS=1 and ENABLE_HSTS=1 in .env.
  #   4. Change the frontend port from "5000:3000" to internal-only: "127.0.0.1:5000:3000"
  #
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: biomate-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"    # HTTP/3
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - biomate-caddy-data:/data
  #     - biomate-caddy-config:/config
  #   depends_on:
  #     - frontend
  #   restart: unless-stopped
  #   networks:
  #     - biomate-network

  # ── Ollama (local LLM — optional, uncomment to enable) ─────────────────────
  # Requires a machine with ≥32 GB RAM. GPU strongly recommended.
  # After enabling, set GALAXY_AI_LLM_PROVIDER=ollama in .env
  # Then pull a model: docker exec biomate-ollama ollama pull qwen3:32b
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: biomate-ollama
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   volumes:
  #     - biomate-ollama-models:/root/.ollama
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - biomate-network

networks:
  biomate-network:
    driver: bridge

volumes:
  biomate-postgres-data:
  biomate-backend-db:
  biomate-backend-logs:
  biomate-nf-work:            # Nextflow work dir + outputs (survives container restarts)
  biomate-redis-data:
  # biomate-caddy-data:       # uncomment when using Caddy
  # biomate-caddy-config:     # uncomment when using Caddy
  # biomate-ollama-models:    # uncomment when using Ollama
