# Autofix Benchmark — 20 Deliberately-Broken Workflow Cases
# Each case has: category, workflow, params (with bug), error_log, expected_fix
# Categories: genome_mismatch, missing_input, param_type_error, resource_failure

---
cases:
  # ──────────────────────────────────────────
  # Category A: Wrong genome build (5 cases)
  # ──────────────────────────────────────────
  - id: af_001
    category: genome_mismatch
    workflow: nf-core/rnaseq
    description: "hg19 genome specified but annotations require hg38"
    params:
      genome: hg19
      aligner: star
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:ALIGN_STAR:STAR_ALIGN (SRR1234567)'
      Caused by:
        Process `STAR_ALIGN` terminated with an error exit status (1)
      Command error:
        EXITING: Fatal INPUT FILE error, no valid exon lines in the GTF file
        SOLUTION: check that the GTF file contains valid exon records matching chromosome names
        STAR index built with: GRCh38 (chr1..chr22,chrX,chrY)
        GTF annotation file uses: hg19 chromosome naming (chr1..chr22,X,Y)
        FATAL ERROR
    expected_fix: "Change genome parameter from 'hg19' to 'GRCh38' or 'hg38' to match the STAR index built for GRCh38"
    expected_fixer_class: "NextflowParameterFixer or ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_002
    category: genome_mismatch
    workflow: nf-core/chipseq
    description: "mm9 genome used but iGenomes only has mm10"
    params:
      genome: mm9
      input: "samplesheet.csv"
      min_reps_consensus: 1
    error_log: |
      ERROR ~ Error executing process 'NFCORE_CHIPSEQ:CHIPSEQ:PREPARE_GENOME:BWA_INDEX'
      Caused by:
        Process `BWA_INDEX` terminated with an error exit status (1)
      Command error:
        Cannot find genome index for mm9 in iGenomes configuration.
        Available mouse genomes: mm10, GRCm38
        Please update genome parameter to a supported genome build.
    expected_fix: "Change genome from 'mm9' to 'mm10' or 'GRCm38' — mm9 is deprecated and not available in iGenomes"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_003
    category: genome_mismatch
    workflow: nf-core/sarek
    description: "Mixed genome: fasta=hg38 but dbsnp=hg19 VCF"
    params:
      genome: GATK.GRCh38
      fasta: "s3://biomate/references/GRCh38.fa"
      dbsnp: "s3://biomate/references/dbsnp_138.hg19.vcf.gz"
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:MARKDUPLICATES:GATK4_APPLYBQSR'
      Caused by:
        net.sf.picard.util.PicardException: SAM/BAM file header sequence dictionary entries do not match VCF header entries
      Command error:
        Error: Sequence dictionary mismatch
        Contig chr1 in SAM has length 248956422 (GRCh38)
        Contig chr1 in VCF has length 249250621 (hg19/GRCh37)
        FATAL: Cannot proceed with BQSR
    expected_fix: "Replace dbsnp with hg38-compatible dbsnp file (dbsnp_146.hg38.vcf.gz or equivalent GRCh38 version)"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: medium

  - id: af_004
    category: genome_mismatch
    workflow: nf-core/atacseq
    description: "Genome 'GRCh37' used but peak calling needs chromosome sizes for GRCh38"
    params:
      genome: GRCh37
      input: "samplesheet.csv"
      fragment_size: 200
    error_log: |
      ERROR ~ Error executing process 'NFCORE_ATACSEQ:ATACSEQ:MACS2_CALLPEAK'
      MACS2 error: Cannot find chromosome size file for GRCh37.
      The provided genome 'GRCh37' uses GRCh37 chromosome sizes but peaks
      extend beyond chromosome boundaries.
      Hint: Use 'GRCh38' for human ATAC-seq analyses.
    expected_fix: "Update genome from 'GRCh37' to 'GRCh38' for ATAC-seq peak calling compatibility"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_005
    category: genome_mismatch
    workflow: nf-core/methylseq
    description: "bismark genome index built for hg38 but params specify hg19 causing FASTA mismatch"
    params:
      genome: hg19
      aligner: bismark
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_METHYLSEQ:METHYLSEQ:BISMARK:BISMARK_ALIGN'
      BISMARK ERROR: Genome index was built for:
        /data/references/GRCh38/Bisulfite_Genome/
      But --genome hg19 resolves to:
        /data/references/hg19/genome.fa
      These do not match. Please rebuild index for hg19 or change --genome to hg38.
    expected_fix: "Change genome from 'hg19' to 'hg38' to match the existing Bismark genome index, or rebuild the index for hg19"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  # ──────────────────────────────────────────
  # Category B: Missing required input (5 cases)
  # ──────────────────────────────────────────
  - id: af_006
    category: missing_input
    workflow: nf-core/rnaseq
    description: "Samplesheet CSV file path does not exist on S3"
    params:
      genome: hg38
      aligner: star
      input: "s3://biomate-work/user123/samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:INPUT_CHECK:SAMPLESHEET_CHECK'
      Caused by:
        java.nio.file.NoSuchFileException: s3://biomate-work/user123/samplesheet.csv
      Message:
        The provided samplesheet does not exist.
        Please check the path: s3://biomate-work/user123/samplesheet.csv
    expected_fix: "Upload the samplesheet CSV file to S3 or correct the path — file does not exist at s3://biomate-work/user123/samplesheet.csv"
    expected_fixer_class: "DataFileFixer"
    fix_difficulty: easy

  - id: af_007
    category: missing_input
    workflow: nf-core/clipseq
    description: "Required ncrna_fasta parameter missing entirely"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      smrna_org: homo_sapiens
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --ncrna_fasta: Missing required parameter
        The ncrna_fasta file is required for rRNA/tRNA/snRNA removal.
        Download from: https://www.clipseq.org/references/ncrna_hg38.fa
      Please provide --ncrna_fasta <path_to_ncrna_fasta>
    expected_fix: "Provide --ncrna_fasta with a path to the ncRNA FASTA file (required for CLIP-seq rRNA removal step)"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_008
    category: missing_input
    workflow: nf-core/sarek
    description: "FASTQ files listed in samplesheet have wrong relative paths (missing data/ prefix)"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      tools: "haplotypecaller"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:FASTQC'
      Caused by:
        java.nio.file.NoSuchFileException: sample1_R1.fastq.gz
      Stack trace:
        All 4 samples in samplesheet.csv failed with file-not-found:
          sample1_R1.fastq.gz → not found (expected at /work/data/sample1_R1.fastq.gz)
          sample1_R2.fastq.gz → not found
        Paths in samplesheet appear to be relative without basedir.
    expected_fix: "Update samplesheet.csv to use absolute paths or S3 URIs for all FASTQ files — relative paths are not supported in Nextflow on AWS Batch"
    expected_fixer_class: "SamplesheetFixer"
    fix_difficulty: medium

  - id: af_009
    category: missing_input
    workflow: drug_discovery/gromacs_protein_md
    description: "Protein PDB file not provided — required for MD simulation"
    params:
      ligand_smiles: "CC(=O)Oc1ccccc1C(=O)O"
      forcefield: amber99sb-ildn
      simulation_time_ns: 10
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --protein_pdb: Required parameter missing
        A protein PDB file is required for molecular dynamics simulation.
        Please provide the path to your protein structure file.
      Hint: You can download structures from https://www.rcsb.org/
    expected_fix: "Provide --protein_pdb with a path to the receptor protein PDB file — required for MD simulation setup"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_010
    category: missing_input
    workflow: nf-core/differentialabundance
    description: "Count matrix missing; only samplesheet provided"
    params:
      input: "samplesheet.csv"
      contrasts: "contrasts.csv"
      matrix: ""
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --matrix: Must be a non-empty file path
        The count matrix file (--matrix) is required for differential abundance analysis.
        This should be a tab-delimited file with genes as rows and samples as columns.
        Example: --matrix counts.tsv
    expected_fix: "Provide --matrix with a path to the count matrix (genes × samples TSV/CSV) — typically produced by nf-core/rnaseq STAR_SALMON output"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  # ──────────────────────────────────────────
  # Category C: Wrong parameter type (5 cases)
  # ──────────────────────────────────────────
  - id: af_011
    category: param_type_error
    workflow: nf-core/rnaseq
    description: "min_trimmed_reads passed as string '100' instead of integer 100"
    params:
      genome: hg38
      input: "samplesheet.csv"
      min_trimmed_reads: "100"
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --min_trimmed_reads: String value '100' is not a valid integer
        Expected type: integer
        Received: "100" (string)
        The minimum number of trimmed reads must be an integer value, not a quoted string.
    expected_fix: "Change min_trimmed_reads from string '\"100\"' to integer 100 — remove quotes"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_012
    category: param_type_error
    workflow: nf-core/sarek
    description: "skip_qc passed as string 'true' instead of boolean true"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      skip_qc: "true"
      tools: "haplotypecaller"
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --skip_qc: String value 'true' is not a valid boolean
        Expected type: boolean
        Received: "true" (string)
        Use --skip_qc (flag) or --skip_qc true (unquoted) in Nextflow params.
    expected_fix: "Change skip_qc from string '\"true\"' to boolean true — Nextflow booleans must not be quoted"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_013
    category: param_type_error
    workflow: nf-core/chipseq
    description: "min_reps_consensus set to 0.5 (float) instead of integer"
    params:
      genome: mm10
      input: "samplesheet.csv"
      min_reps_consensus: 0.5
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --min_reps_consensus: Float value 0.5 is not a valid integer
        Expected type: integer (minimum 1)
        Received: 0.5 (float)
        The minimum number of replicates for consensus peaks must be a whole number.
    expected_fix: "Change min_reps_consensus from 0.5 to 1 (integer) — must be a whole number ≥ 1"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_014
    category: param_type_error
    workflow: drug_discovery/alphafold_db_search
    description: "max_template_date must be YYYY-MM-DD format string, not Unix timestamp"
    params:
      input_fasta: "protein.fasta"
      db_preset: full_dbs
      max_template_date: 1704067200
    error_log: |
      ERROR ~ Error executing process 'ALPHAFOLD_DB_SEARCH:ALPHAFOLD_PREDICT'
      alphafold2 ValueError: max_template_date must be in YYYY-MM-DD format.
      Received: 1704067200 (Unix timestamp)
      Expected: "2024-01-01" (ISO date string)
    expected_fix: "Change max_template_date from Unix timestamp 1704067200 to ISO date string '2024-01-01'"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: medium

  - id: af_015
    category: param_type_error
    workflow: nf-core/methylseq
    description: "clip_r1 and clip_r2 passed as strings instead of integers"
    params:
      genome: hg38
      aligner: bismark
      input: "samplesheet.csv"
      clip_r1: "10"
      clip_r2: "10"
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      * --clip_r1: String value '10' is not a valid integer
      * --clip_r2: String value '10' is not a valid integer
        Trim Galore clip parameters must be integers (number of bases to clip).
        Received both as quoted strings — remove quotes.
    expected_fix: "Change clip_r1 and clip_r2 from strings '\"10\"' to integers 10 — remove quotes from both parameters"
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  # ──────────────────────────────────────────
  # Category D: Resource constraint failures (5 cases)
  # ──────────────────────────────────────────
  - id: af_016
    category: resource_failure
    workflow: nf-core/rnaseq
    description: "STAR alignment OOM on default 32GB memory — needs 64GB for large genome"
    params:
      genome: hg38
      aligner: star
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:ALIGN_STAR:STAR_ALIGN (sample_001)'
      Caused by:
        Process `STAR_ALIGN` terminated with an error exit status (137)
      Command error:
        EXITING because of FATAL ERROR: out of memory
        Allocating genome: allocated 31.9 GB
        Maximum allowed: 32.0 GB
      Hint: Increase process.memory for STAR_ALIGN to at least 64.GB
    expected_fix: "Increase memory for STAR_ALIGN process — add 'process { withName: STAR_ALIGN { memory = 64.GB } }' to nextflow.config or use --max_memory 64.GB"
    expected_fixer_class: "AWSResourceFixer or RetryStrategyFixer"
    fix_difficulty: medium

  - id: af_017
    category: resource_failure
    workflow: nf-core/sarek
    description: "HaplotypeCaller timeout — long-running process killed after 6h wall time"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      tools: "haplotypecaller"
      intervals: "wgs_calling_regions.hg38.bed"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:VARIANT_CALLING:GATK4_HAPLOTYPECALLER (sample_001_chr1)'
      Caused by:
        Process `GATK4_HAPLOTYPECALLER` terminated with an error exit status (143)
      SIGTERM received — job exceeded wall time limit (21600s / 6h)
      AWS Batch job timed out. Increase timeout or split intervals.
      Hint: Run per-chromosome intervals in parallel, or increase jobTimeoutInSecs.
    expected_fix: "Increase time limit for HAPLOTYPECALLER — add 'process { withName: GATK4_HAPLOTYPECALLER { time = 24.h } }' to config, or enable scatter-gather with split interval list"
    expected_fixer_class: "AWSResourceFixer or RetryStrategyFixer"
    fix_difficulty: medium

  - id: af_018
    category: resource_failure
    workflow: drug_discovery/amber_pmemd_md
    description: "GPU out of memory during AMBER production MD with large complex"
    params:
      protein_pdb: "s3://biomate/systems/5uf0.pdb"
      ligand_mol2: "s3://biomate/ligands/ABL1_inhibitor.mol2"
      production_steps: 50000000
    error_log: |
      ERROR ~ Error executing process 'AMBER_PMEMD_MD:AMBER_PRODUCTION_MD (5uf0_run1)'
      Caused by:
        sander/pmemd.cuda error: GPU out of memory
        Allocated: 16384 MB (16 GB VRAM on p3.2xlarge)
        Required: ~24 GB for solvated box (98,432 atoms)
      Hint: Use a larger GPU instance (p3.8xlarge, 4x V100) or reduce solvent box padding.
    expected_fix: "Switch to a larger GPU instance (p3.8xlarge with 4 V100s) or reduce box_padding parameter from default 10Å to 8Å to reduce system size"
    expected_fixer_class: "AWSResourceFixer"
    fix_difficulty: hard

  - id: af_019
    category: resource_failure
    workflow: nf-core/differentialabundance
    description: "R process OOM during DESeq2 on large 50k gene × 200 sample matrix"
    params:
      input: "samplesheet.csv"
      matrix: "s3://biomate/counts/full_matrix.tsv"
      contrasts: "contrasts.csv"
      differential_method: deseq2
    error_log: |
      ERROR ~ Error executing process 'NFCORE_DIFFERENTIALABUNDANCE:DIFFERENTIALABUNDANCE:DESEQ2_NORM'
      Caused by:
        Process `DESEQ2_NORM` terminated with an error exit status (1)
      Command error:
        Error in estimateSizeFactors(dds) :
          cannot allocate vector of size 3.7 Gb
        Execution halted
      Process memory: 16 GB (used 15.9 GB)
    expected_fix: "Increase DESeq2 process memory to 32GB — large matrix (50k genes × 200 samples) exceeds 16GB limit"
    expected_fixer_class: "AWSResourceFixer"
    fix_difficulty: medium

  - id: af_020
    category: resource_failure
    workflow: nf-core/rnaseq
    description: "Disk space exhausted during FASTQ download — S3 work bucket full"
    params:
      genome: hg38
      aligner: star
      input: "samplesheet.csv"
      save_merged_fastq: true
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:FASTQ_FASTQC_UMITOOLS_TRIMGALORE:TRIMGALORE'
      Caused by:
        Process `TRIMGALORE` terminated with an error exit status (1)
      Command error:
        gzip: stdout: No space left on device
        EBS volume /data exhausted (200 GB)
        Temporary merged FASTQ files consuming: 189 GB
      Hint: Disable --save_merged_fastq or increase EBS volume size.
    expected_fix: "Set save_merged_fastq to false (removes 189GB of intermediate files) or increase the Batch job EBS volume size beyond 200GB"
    expected_fixer_class: "AWSResourceFixer"
    fix_difficulty: easy

  # ──────────────────────────────────────────
  # Category A continued: genome_mismatch (additional cases)
  # ──────────────────────────────────────────
  - id: af_021
    category: genome_mismatch
    workflow: nf-core/rnaseq
    description: "Mouse genome mm10 used for human samples — wrong species"
    params:
      genome: mm10
      aligner: star
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:ALIGN_STAR:STAR_ALIGN (SRR9876543)'
      Caused by:
        STAR alignment rate 2.3% — extremely low mapping
        Genome: mm10 (Mus musculus)
        Reads appear to be from Homo sapiens (BLAST hit: human chromosome sequences)
      Warning: >95% reads unmapped — possible species mismatch.
    expected_fix: "Change genome from 'mm10' to 'GRCh38' or 'hg38' — samples are human, not mouse"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_022
    category: genome_mismatch
    workflow: nf-core/sarek
    description: "Rat genome (Rnor_6.0) used but annotation incompatible with GATK bundle"
    params:
      genome: Rnor_6.0
      input: "samplesheet.csv"
      tools: "haplotypecaller"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:PREPARE_GENOME:GATK4_CREATESEQUENCEDICTIONARY'
      Caused by:
        htsjdk.samtools.SAMException: Sequence dictionary incompatible.
        Genome: Rnor_6.0 not found in iGenomes GATK bundle.
        Available rat genomes in GATK bundle: mRatBN7.2
        SOLUTION: Update genome parameter to 'mRatBN7.2' for current Rattus norvegicus assembly.
    expected_fix: "Change genome from 'Rnor_6.0' (deprecated) to 'mRatBN7.2' — GATK bundle only includes the latest rat assembly"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_023
    category: genome_mismatch
    workflow: nf-core/chipseq
    description: "Zebrafish genome danRer7 (outdated) — MACS2 chromosome sizes wrong"
    params:
      genome: danRer7
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_CHIPSEQ:CHIPSEQ:MARK_DUPLICATES_BWA:BAM_SORT_SAMTOOLS'
      Caused by:
        MACS2 error: Chromosome chrZv not found in genome file.
        danRer7 assembly lacks chromosome chrZv present in reads.
        Available current zebrafish assembly: GRCz11 (danRer11)
    expected_fix: "Change genome from 'danRer7' to 'GRCz11' or 'danRer11' — danRer7 is outdated and missing chromosomes present in recent ChIP-seq data"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_024
    category: genome_mismatch
    workflow: nf-core/methylseq
    description: "Arabidopsis genome TAIR9 used but index built for TAIR10"
    params:
      genome: TAIR9
      aligner: bismark
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_METHYLSEQ:METHYLSEQ:BISMARK:BISMARK_ALIGN'
      Caused by:
        Bismark ERROR: genome_index was built from TAIR10 (Col-0 reference)
        --genome TAIR9 resolves to a FASTA that does not match the pre-built index.
        Chromosome lengths differ: Chr1 TAIR10=30427671, TAIR9=30432563
    expected_fix: "Change genome from 'TAIR9' to 'TAIR10' to match the pre-built Bismark genome index"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_025
    category: genome_mismatch
    workflow: nf-core/rnaseq
    description: "Drosophila genome BDGP5 used — annotations incompatible with modern GTF"
    params:
      genome: BDGP5
      aligner: star
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:ALIGN_STAR:STAR_GENOMEGENERATE'
      GTF file from Ensembl 79 (BDGP5) has 0 valid gene_id entries.
      Current GTF format requires gene_id in quotes — BDGP5 GTF is from Ensembl <77.
      Hint: Use BDGP6 (dm6) with current GTF from Ensembl 109+.
    expected_fix: "Change genome from 'BDGP5' to 'BDGP6' (dm6) — BDGP5 GTF annotations are outdated and incompatible with nf-core/rnaseq GTF parsing"
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: medium

  # ──────────────────────────────────────────
  # Category B continued: missing_input (additional cases)
  # ──────────────────────────────────────────
  - id: af_026
    category: missing_input
    workflow: nf-core/rnaseq
    description: "Samplesheet CSV missing required 'strandedness' column"
    params:
      genome: hg38
      aligner: star
      input: "samplesheet.csv"
    error_log: |
      ERROR ~ Validation of pipeline parameters failed!
      SAMPLESHEET_CHECK error: Missing required column 'strandedness' in samplesheet.
      Required columns: sample, fastq_1, fastq_2, strandedness
      Provided columns: sample, fastq_1, fastq_2
      Add 'strandedness' column with values: auto, forward, reverse, or unstranded.
    expected_fix: "Add a 'strandedness' column to samplesheet.csv — valid values are 'auto', 'forward', 'reverse', or 'unstranded' (use 'auto' if unsure)"
    expected_fixer_class: "SamplesheetFixer"
    fix_difficulty: easy

  - id: af_027
    category: missing_input
    workflow: nf-core/sarek
    description: "BAM files provided but pipeline expects FASTQ — wrong input format"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      tools: "haplotypecaller"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:FASTQ_FASTQC_UMITOOLS_TRIMGALORE'
      Caused by:
        java.lang.IllegalArgumentException: Input file has .bam extension but FASTQ expected.
        FASTQ_FASTQC process requires gzip-compressed FASTQ (.fastq.gz) files.
        Provide FASTQ files or use --step 'markduplicates' to start from BAM.
    expected_fix: "Either provide FASTQ files in the samplesheet, or add '--step markduplicates' to start the Sarek pipeline from existing BAM files"
    expected_fixer_class: "SamplesheetFixer or NextflowParameterFixer"
    fix_difficulty: medium

  - id: af_028
    category: missing_input
    workflow: nf-core/differentialabundance
    description: "S3 count matrix path not accessible — wrong bucket permissions"
    params:
      input: "samplesheet.csv"
      matrix: "s3://private-lab-bucket/counts/matrix.tsv"
      contrasts: "contrasts.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_DIFFERENTIALABUNDANCE:DIFFERENTIALABUNDANCE:CUSTOM_MATRIXFILTER'
      Caused by:
        com.amazonaws.services.s3.model.AmazonS3Exception: Access Denied (Service: Amazon S3)
        Status Code: 403
        Bucket: private-lab-bucket
        Key: counts/matrix.tsv
        The Nextflow execution role does not have s3:GetObject permission on this bucket.
    expected_fix: "Grant the Nextflow execution IAM role s3:GetObject permission on 'private-lab-bucket', or copy the count matrix to an accessible S3 location"
    expected_fixer_class: "DataFileFixer or AWSPermissionFixer"
    fix_difficulty: medium

