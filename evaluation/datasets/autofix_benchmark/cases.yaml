    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:INPUT_CHECK:SAMPLESHEET_CHECK'
      Caused by:
        nf-core/rnaseq samplesheet validation failed:
        Expected column 'fastq_1' not found. Found: sample, read1, read2, strandedness
        Required samplesheet columns: sample, fastq_1, fastq_2, strandedness
        Please check the nf-core samplesheet format at https://nf-co.re/rnaseq/usage#samplesheet
    expected_fix: "Rename column headers in samplesheet.csv from 'read1'/'read2' to 'fastq_1'/'fastq_2'. Use the nf-core samplesheet format with exactly these columns: sample, fastq_1, fastq_2, strandedness."
    expected_fixer_class: "SamplesheetFixer"
    fix_difficulty: easy

  - id: af_082
    category: param_scope_error
    workflow: nf-core/sarek
    description: "WES samplesheet missing 'intervals' parameter — exome target BED not specified"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      wes: true
      tools: "haplotypecaller"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:VARIANT_CALLING:HAPLOTYPECALLER (sample_01)'
      Caused by:
        GATK HaplotypeCaller WARNING: Running without --intervals on a WES sample.
        This will call variants across the entire genome (30x slower than with target BED).
        For exome analysis, provide the capture kit BED file via --intervals.
        Estimated completion: 72 hours (expected 2-4 hours with intervals)
    expected_fix: "Add '--intervals s3://biomate/refs/agilent_sureselect_v7.bed' (or appropriate capture kit BED) to the Sarek run. Set the intervals parameter in nextflow.config or pass via CLI."
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_083
    category: param_scope_error
    workflow: nf-core/differentialabundance
    description: "Contrasts CSV references non-existent group label causing R crash"
    params:
      input: "samplesheet.csv"
      contrasts: "contrasts.csv"
      matrix: "counts.csv"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_DIFFERENTIALABUNDANCE:DIFFERENTIALABUNDANCE:DESEQ2_DIFFERENTIAL (tumor_vs_normal)'
      Caused by:
        Error in DESeq2::results(dds, contrast = c("condition", "tumor", "Normal")) :
          contrast level 'Normal' not found. Available levels: tumor, normal (case-sensitive)
        Contrast definition: tumor_vs_Normal should be tumor_vs_normal
        Check contrasts.csv column 3 (reference_level) — must match samplesheet condition exactly
    expected_fix: "Fix the contrasts.csv file so the reference level 'Normal' matches the samplesheet condition column exactly (case-sensitive). Change 'Normal' to 'normal' to match the samplesheet entries."
    expected_fixer_class: "SamplesheetFixer"
    fix_difficulty: easy

  - id: af_084
    category: param_scope_error
    workflow: nf-core/scrnaseq
    description: "Expected cells parameter set too high — Cell Ranger recovers wrong cell count"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      aligner: "cellranger"
      expected_cells: 50000
    error_log: |
      ERROR ~ Warning during process 'NFCORE_SCRNASEQ:SCRNASEQ:CELLRANGER_COUNT (sample_01)'
      Caused by:
        Cell Ranger detected only 1,832 cells but --expect-cells=50000 was specified.
        With expect-cells >> actual cells, Cell Ranger may include empty droplets as cells.
        Recovered 48,921 barcodes (expected: 50000; actual cells in knee plot: ~2000).
        Quality will be poor. Re-run with --expect-cells=2000 or use auto-detection.
    expected_fix: "Re-run with 'expected_cells = 2000' matching the knee plot estimate, or set 'expected_cells = 0' to use Cell Ranger's automatic cell detection. Re-examine the knee plot in the Cell Ranger summary HTML."
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_085
    category: param_scope_error
    workflow: nf-core/chipseq
    description: "Read extension (extsize) set for single-end but samples are actually paired-end"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      read_length: 150
      macs_gsize: "hs"
      single_end: true
    error_log: |
      ERROR ~ Warning during process 'NFCORE_CHIPSEQ:CHIPSEQ:PEAK_CALLING:MACS2_CALLPEAK (sample_01)'
      Caused by:
        MACS2 WARNING: --nomodel with --extsize applied to paired-end BAM.
        Paired-end reads detected (read names contain /1 /2 suffixes).
        For paired-end, MACS2 should use -f BAMPE not -f BAM with --extsize.
        Fragment size extension is meaningless for paired-end data.
    expected_fix: "Set 'single_end = false' in the Sarek/ChIP-seq configuration so MACS2 is called with '-f BAMPE' for paired-end data. Verify the samplesheet does not hardcode single_end column."
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  - id: af_086
    category: param_scope_error
    workflow: nf-core/methylseq
    description: "Non-directional bisulfite library specified but pipeline defaults to directional"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      aligner: "bismark"
    error_log: |
      ERROR ~ Warning during process 'NFCORE_METHYLSEQ:METHYLSEQ:BISMARK_ALIGN (sample_01)'
      Caused by:
        Bismark WARNING: Low mapping rate: 12% (expected >60% for WGBS)
        Library type: non-directional (PBAT / random primer protocol) detected from read orientation
        But pipeline is running in directional mode (default).
        For non-directional libraries use --non_directional flag.
        Non-directional libraries align to all four strands (OT, OB, CTOT, CTOB).
    expected_fix: "Add '--non_directional' to the methylseq pipeline parameters: set 'non_directional = true' in nextflow.config or pass '--non_directional' on the CLI. Non-directional PBAT and random primer libraries require all four bisulfite strands."
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: medium

  # ──────────────────────────────────────────────────────────────────────────
  # Category I (new): Cloud / storage access errors
  # ──────────────────────────────────────────────────────────────────────────
  - id: af_087
    category: cloud_storage_error
    workflow: nf-core/rnaseq
    description: "S3 bucket path typo — bucket name has extra hyphen causing NoSuchBucket error"
    params:
      genome: GRCh38
      aligner: star
      input: "samplesheet.csv"
      outdir: "s3://biomate--results/rnaseq_run_001/"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:ALIGN_STAR:STAR_ALIGN (sample_01)'
      Caused by:
        An error occurred (NoSuchBucket) when calling the PutObject operation:
        The specified bucket does not exist: biomate--results
        Check the bucket name — S3 bucket names cannot contain consecutive hyphens.
        Valid bucket: s3://biomate-results/; Invalid: s3://biomate--results/
    expected_fix: "Fix the outdir parameter: change 's3://biomate--results/' to 's3://biomate-results/' (remove the extra hyphen). Verify the bucket exists with 'aws s3 ls s3://biomate-results/'."
    expected_fixer_class: "CloudStorageFixer"
    fix_difficulty: easy

  - id: af_088
    category: cloud_storage_error
    workflow: nf-core/sarek
    description: "IAM role missing s3:PutObject permission for results bucket"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      tools: "haplotypecaller"
      outdir: "s3://biomate-results/sarek_germline/"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:ANNOTATE:SNPEFF_ANNOTATE (sample_01)'
      Caused by:
        An error occurred (AccessDenied) when calling the PutObject operation: Access Denied
        IAM role 'arn:aws:iam::399683337364:role/biomate-batch-execution-role' denied.
        Missing permission: s3:PutObject on resource: arn:aws:s3:::biomate-results/*
        Check the IAM role attached to the AWS Batch job definition.
    expected_fix: "Update the IAM role 'biomate-batch-execution-role' to include 's3:PutObject' and 's3:GetObject' permissions on 'arn:aws:s3:::biomate-results/*'. Use AWS IAM console or: aws iam put-role-policy --role-name biomate-batch-execution-role --policy-name S3Results --policy-document file://s3_policy.json"
    expected_fixer_class: "CloudStorageFixer"
    fix_difficulty: medium

  - id: af_089
    category: cloud_storage_error
    workflow: nf-core/atacseq
    description: "Work directory on S3 — Nextflow scratch operations fail on S3 (not POSIX)"
    params:
      genome: GRCm38
      input: "samplesheet.csv"
      workDir: "s3://biomate-work/nextflow_scratch/"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_ATACSEQ:ATACSEQ:ALIGN_BWA_MEM:SAMTOOLS_SORT (sample_01)'
      Caused by:
        java.io.IOException: Cannot rename file: s3://biomate-work/nextflow_scratch/.nf-work/xx/yy/tmp_sort.bam
        S3 does not support atomic rename operations required by Nextflow task staging.
        Use a local scratch directory or EFS for the work directory.
        Recommended: workDir = '/tmp/nextflow_work' or an EFS mount point.
    expected_fix: "Change the work directory to a local path or EFS mount: set 'workDir = \"/tmp/nextflow_work\"' or 'workDir = \"/mnt/efs/nextflow_work\"'. S3 cannot be used as the Nextflow work directory due to lack of POSIX rename semantics."
    expected_fixer_class: "CloudStorageFixer"
    fix_difficulty: medium

  - id: af_090
    category: cloud_storage_error
    workflow: nf-core/rnaseq
    description: "S3 input files in different region from Batch compute — high latency causes timeout"
    params:
      genome: GRCh38
      aligner: star
      input: "samplesheet.csv"
      input_bucket_region: "eu-west-1"
      batch_region: "us-west-2"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:ALIGN_STAR:STAR_ALIGN (sample_01)'
      Caused by:
        aws s3 cp s3://eu-biomate-data/sample_01_R1.fastq.gz . timed out after 3600s
        Cross-region S3 transfer: eu-west-1 → us-west-2 (47.2 GB file)
        Estimated transfer time: 8.3 hours at 15 MB/s cross-region bandwidth
        Consider using S3 same-region access or AWS DataSync for large cross-region transfers
    expected_fix: "Either: (1) Copy input data to us-west-2 bucket using 'aws s3 cp --region us-west-2', (2) Move the Batch compute environment to eu-west-1, or (3) Use AWS DataSync for scheduled replication. Always keep compute and data in the same AWS region."
    expected_fixer_class: "CloudStorageFixer"
    fix_difficulty: medium

  # ──────────────────────────────────────────────────────────────────────────
  # Category J (new): Workflow logic / output assertion errors
  # ──────────────────────────────────────────────────────────────────────────
  - id: af_091
    category: output_assertion_error
    workflow: nf-core/rnaseq
    description: "DESeq2 finds zero significant DE genes — batch effect not corrected"
    params:
      genome: GRCh38
      aligner: star
      input: "samplesheet.csv"
      deseq2_vst: true
    error_log: |
      WARNING in process 'NFCORE_RNASEQ:RNASEQ:DESEQ2_QC:DESEQ2_QC'
      DESeq2 differential expression results summary:
      LFC > 0 (up)       : 0, 0%
      LFC < 0 (down)     : 0, 0%
      outliers [1]       : 0, 0%
      low counts [2]     : 12345, 42%
      PCA plot shows PC1 separates by sequencing batch (batch1/batch2), not by condition.
      Suggest: re-run with batch correction (include batch as covariate in DESeq2 design).
    expected_fix: "Add batch as a covariate in the DESeq2 design formula: change 'design = ~condition' to 'design = ~batch + condition'. Add a 'batch' column to the samplesheet or provide a --additional_params 'design_formula=~batch+condition'."
    expected_fixer_class: "WorkflowLogicFixer"
    fix_difficulty: medium

  - id: af_092
    category: output_assertion_error
    workflow: nf-core/sarek
    description: "Very low somatic variant count — normal contamination in tumor sample"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      tools: "mutect2"
    error_log: |
      WARNING in process 'NFCORE_SAREK:SAREK:VARIANT_CALLING:GATK4_MUTECT2 (tumor_vs_normal)'
      Mutect2 FilterMutectCalls summary:
      Total calls: 48,231
      PASS: 12 variants (0.02%)
      Filtered - normal_artifact: 44,891 (93%)
      Filtered - contamination: 3,112 (6.4%)
      GetPileupSummaries detected 38% contamination in tumor sample (threshold: 5%)
      The normal sample may be contaminated with tumor DNA, or samples may be swapped.
    expected_fix: "Verify sample identity with fingerprinting ('CrosscheckFingerprints' GATK tool). If samples are correct, the tumor has unusually high contamination — consult the pathology report for tumor purity. Re-run CalculateContamination with corrected matched-normal, or use tumor-only calling with GNOMAD germline resource."
    expected_fixer_class: "WorkflowLogicFixer"
    fix_difficulty: hard

  - id: af_093
    category: output_assertion_error
    workflow: nf-core/scrnaseq
    description: "All cells cluster into single cluster — doublet removal not run, high ambient RNA"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      aligner: "cellranger"
    error_log: |
      WARNING in process 'NFCORE_SCRNASEQ:SCRNASEQ:SEURAT_CLUSTERING (sample_01)'
      Seurat clustering quality warning:
      Resolution 0.5: 1 cluster found (expected 5-15 for PBMC data)
      Median genes/cell: 8,432 (>4000 may indicate doublets)
      Doublet fraction estimated: 34% (DoubletFinder) — above 20% threshold
      Ambient RNA score (SoupX): 0.42 — very high contamination
      Cells not removed: scrublet/doubletfinder not configured in this run
    expected_fix: "Re-run with doublet removal enabled: add '--remove_doublets true' and configure SoupX ambient RNA correction. Filter cells with nGenes > 6000 as likely doublets. Consider re-loading with a lower expected cell count to improve Cell Ranger knee detection."
    expected_fixer_class: "WorkflowLogicFixer"
    fix_difficulty: medium

  - id: af_094
    category: output_assertion_error
    workflow: nf-core/chipseq
    description: "ChIP-seq FRiP score very low — IP failed, mostly background signal"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      macs_gsize: "hs"
    error_log: |
      WARNING in process 'NFCORE_CHIPSEQ:CHIPSEQ:PEAK_CALLING:MACS2_CALLPEAK (h3k4me3_sample)'
      ChIP-seq QC metrics:
      FRiP (Fraction of Reads in Peaks): 0.003 (ENCODE minimum: 0.01; recommended: >0.1)
      Total peaks called: 47 (expected >10,000 for H3K4me3)
      Input control has 8.2x more signal than IP in enriched regions
      Pearson correlation IP vs Input: 0.97 (IP is almost identical to input = failed ChIP)
    expected_fix: "The ChIP enrichment failed experimentally — this is likely a wet-lab issue (antibody lot, crosslinking time, sonication). Check: (1) antibody specificity, (2) sonication fragment size distribution, (3) confirm IP vs Input labels are not swapped. Re-run ChIP-seq from wet lab step before reanalyzing."
    expected_fixer_class: "WorkflowLogicFixer"
    fix_difficulty: hard

  - id: af_095
    category: output_assertion_error
    workflow: nf-core/rnaseq
    description: "Strand specificity parameter wrong — counts are all near zero for all genes"
    params:
      genome: GRCh38
      aligner: star
      input: "samplesheet.csv"
      stranded: "reverse"
    error_log: |
      WARNING in process 'NFCORE_RNASEQ:RNASEQ:QUANTIFY_SALMON:SALMON_QUANT (sample_01)'
      Salmon quantification warning:
      Mapping rate: 3.2% (expected >70% for good RNA-seq)
      Inferred strand: forward (ISF library)
      Configured strand: reverse (ISR)
      Mismatch between inferred and configured library type.
      Most reads are being discarded due to incorrect strandedness.
    expected_fix: "Change the stranded parameter from 'reverse' to 'forward' to match the inferred ISF library type. Verify with: RSeQC infer_experiment.py -r genes.bed -i sample.bam. Common strand conventions: dUTP/TruSeq stranded = 'reverse'; ScriptSeq = 'forward'."
    expected_fixer_class: "NextflowParameterFixer"
    fix_difficulty: easy

  # ──────────────────────────────────────────────────────────────────────────
  # Mixed additional to reach 100 total
  # ──────────────────────────────────────────────────────────────────────────
  - id: af_096
    category: resource_failure
    workflow: nf-core/sarek
    description: "GATK MarkDuplicates JVM heap exhausted on large WGS BAM (150GB)"
    params:
      genome: GATK.GRCh38
      input: "samplesheet.csv"
      tools: "haplotypecaller"
      markduplicates_java_options: "-Xmx8g"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:MARKDUPLICATES:GATK4_MARKDUPLICATES (sample_01)'
      Caused by:
        java.lang.OutOfMemoryError: Java heap space
        GATK MarkDuplicates process killed (OOM).
        BAM file size: 152 GB (deep WGS 60x)
        Configured JVM heap: 8 GB (too small for deep WGS — recommend 24-32 GB)
    expected_fix: "Increase the JVM heap allocation: set 'markduplicates_java_options = \"-Xmx32g -Xms8g\"' in nextflow.config. Also increase the AWS Batch job memory from 16 GB to 64 GB for this process."
    expected_fixer_class: "ResourceFixer"
    fix_difficulty: easy

  - id: af_097
    category: missing_input
    workflow: nf-core/differentialabundance
    description: "Annotation GTF not provided — gene symbol annotation step skipped silently"
    params:
      input: "samplesheet.csv"
      contrasts: "contrasts.csv"
      matrix: "counts.csv"
    error_log: |
      WARNING in process 'NFCORE_DIFFERENTIALABUNDANCE:DIFFERENTIALABUNDANCE:ANNOTATE_GENES'
      GTF annotation file not provided (--gtf not set).
      Gene symbol annotation will be skipped.
      Output will contain only Ensembl gene IDs (ENSG00000...) without gene names.
      Downstream pathway analysis and visualization may fail without gene symbols.
      Provide: --gtf s3://biomate/refs/gencode.v44.annotation.gtf.gz
    expected_fix: "Add '--gtf s3://biomate/refs/gencode.v44.annotation.gtf.gz' to the pipeline parameters. The GTF file enables gene symbol annotation of Ensembl IDs in the DESeq2 output tables and enables gene set enrichment analysis."
    expected_fixer_class: "MissingInputFixer"
    fix_difficulty: easy

  - id: af_098
    category: genome_mismatch
    description: "Mouse WGS data aligned to human GRCh38 — wrong species reference genome"
    workflow: nf-core/sarek
    params:
      genome: GRCh38
      input: "mouse_wgs_samplesheet.csv"
      tools: "haplotypecaller"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SAREK:SAREK:ALIGN_BWA_MEM:BWA_MEM2_MEM (mouse_sample_01)'
      Caused by:
        BWA-MEM2 aligned 45.2 GB mouse WGS reads to GRCh38 (human genome).
        Mapping rate: 28.3% (expected >90% for same-species alignment)
        Mouse (GRCm39) genome required; human (GRCh38) genome used.
        Avg reads/mouse = 28% cross-species alignment (expected: <2%)
    expected_fix: "Change the genome parameter from 'GRCh38' to 'GRCm39' for mouse samples. Use 'genome = \"GRCm39\"' and ensure the mouse reference files (BWA index, GATK mouse bundle) are available in the reference path."
    expected_fixer_class: "ReferenceGenomeFixer"
    fix_difficulty: easy

  - id: af_099
    category: param_type_error
    workflow: nf-core/rnaseq
    description: "min_trimmed_reads passed as float string '0.1' instead of integer count"
    params:
      genome: GRCh38
      aligner: star
      input: "samplesheet.csv"
      min_trimmed_reads: "0.1"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_RNASEQ:RNASEQ:INPUT_CHECK:SAMPLESHEET_CHECK'
      Caused by:
        Validation error for parameter 'min_trimmed_reads':
        Expected type: Integer (read count threshold)
        Got value: '0.1' (float string)
        min_trimmed_reads must be a positive integer specifying the minimum number of reads
        after trimming (e.g., 10000). Use a fraction-based filter with trimmomatic MINLEN instead.
    expected_fix: "Change 'min_trimmed_reads' from '0.1' to an integer read count, e.g., 'min_trimmed_reads = 10000' to require at least 10,000 trimmed reads per sample before alignment. Remove quotes and use an integer value."
    expected_fixer_class: "ParamTypeFixer"
    fix_difficulty: easy

  - id: af_100
    category: resource_failure
    workflow: nf-core/scrnaseq
    description: "Cell Ranger count disk space exhausted — tmp files fill up EBS volume"
    params:
      genome: GRCh38
      input: "samplesheet.csv"
      aligner: "cellranger"
    error_log: |
      ERROR ~ Error executing process 'NFCORE_SCRNASEQ:SCRNASEQ:CELLRANGER_COUNT (sample_01)'
      Caused by:
        [error] cellranger count: No space left on device
        Write failed: /tmp/cellranger_temp/SC_RNA_COUNTER_CS/SC_RNA_COUNTER/PROCESS_BARCODES/_cloupe_preprocess/fork0/chnk0-u4i9iqnxjj/files/barcodes.tsv.gz
        Disk usage at failure: 497 GB / 500 GB (99.4% full)
        Cell Ranger requires 3-4x the input fastq size for temporary files.
        Input fastq: 42 GB → Cell Ranger temp: ~168 GB (on 500 GB EBS)
    expected_fix: "Increase the EBS volume or scratch space to at least 500 GB for this sample (Cell Ranger needs ~4x fastq size in temp space). In AWS Batch, increase the scratch volume in the job definition, or set 'cellranger_tmp_dir' to an EFS mount with sufficient capacity."
    expected_fixer_class: "ResourceFixer"
    fix_difficulty: easy
