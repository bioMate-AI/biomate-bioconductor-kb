# Cross-Domain Routing Accuracy Benchmark
# 155 annotated queries across 11 domains, 3 difficulty levels
#
# Generated: 2026-04-07
# Source: Official nf-co.re pipeline documentation (fetched live)
#         All correct_workflow values are justified by pipeline docs.
#
# Fields:
#   id:                  unique identifier
#   query:               natural-language query a biologist would actually type
#   difficulty:          direct | indirect | adversarial
#   domain:              canonical domain label
#   correct_workflow:    expected top-1 result (exact name as registered in BioMate DB)
#   acceptable_alts:     list of acceptable alternatives (partial credit)
#   disqualified:        workflows that must NOT appear in top-1 (wrong answer)
#   confusable_with:     (adversarial only) domain this is easily confused with
#   notes:               annotation rationale — cites nf-co.re source where possible
#
# Workflow name registry used in this file:
#   nf-core/rnaseq              — bulk RNA-seq FASTQ → counts + QC
#   nf-core/scrnaseq            — single-cell RNA-seq preprocessing (Cell Ranger/STARsolo/Kallisto)
#   nf-core/sarek               — germline AND somatic WGS/WES variant calling
#   nf-core/raredisease         — rare disease WGS/WES with trio analysis + variant scoring
#   nf-core/methylseq           — bisulfite sequencing (WGBS/RRBS) methylation
#   nf-core/chipseq             — ChIP-seq peak calling and differential binding
#   nf-core/atacseq             — ATAC-seq chromatin accessibility
#   nf-core/cutandrun           — CUT&RUN / CUT&TAG / TIPseq profiling
#   nf-core/taxprofiler         — metagenomic taxonomic profiling (Kraken2/MetaPhlAn/mOTUs)
#   nf-core/mag                 — metagenome assembly and binning (MEGAHIT/MetaBAT2/GTDB-Tk)
#   nf-core/ampliseq            — amplicon sequencing (16S/ITS/CO1) with DADA2/QIIME2
#   nf-core/proteomicslfq       — label-free quantification DDA proteomics (OpenMS/MSstats)
#   nf-core/diaproteomics       — data-independent acquisition (DIA) proteomics
#   nf-core/mhcquant            — MHC/HLA immunopeptidomics (T cell epitope quantification)
#   nf-core/proteinfold         — protein structure prediction (AlphaFold2/ESMFold/ColabFold)
#   nf-core/rnafusion           — RNA fusion gene detection (STAR-Fusion/Arriba/FusionCatcher)
#   nf-core/differentialabundance — downstream differential expression/abundance (DESeq2/edgeR)
#   nf-core/smrnaseq            — small RNA / miRNA sequencing and quantification
#   nf-core/spatialvi           — 10x Visium spatial transcriptomics
#   nf-core/airrflow            — adaptive immune repertoire (BCR/TCR) sequencing
#   nf-core/hic                 — Hi-C chromosome conformation capture / 3D genome
#   nf-core/nanoseq             — Oxford Nanopore long-read sequencing (DNA+RNA)
#   nf-core/lncpipe             — long non-coding RNA discovery and differential expression
#   drug_discovery/structure_prediction_docking  — AlphaFold2/Boltz-2 + docking
#   drug_discovery/gromacs_protein_md            — GROMACS molecular dynamics + MM-GBSA
#   drug_discovery/reinvent4_lead_design         — REINVENT4 generative molecule design

