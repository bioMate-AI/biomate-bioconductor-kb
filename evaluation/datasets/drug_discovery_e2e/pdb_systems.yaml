# =========================================================
# Evaluation configuration
# =========================================================

evaluation:
  pipeline_steps:
    - name: structure_retrieval
      tool: alphafold_db_search
      fallback: pdb_direct
    - name: docking
      tool: schrodinger_glide
      mode: SP
      fallback: autodock_vina
    - name: md_simulation
      tool: gromacs_protein_md
      duration_ns: 1
      mm_gbsa: true
    - name: admet
      tool: admet_workflow
      datasets: [hERG, DILI, CYP1A2, CYP3A4, PAMPA]

  metrics:
    - name: spearman_rho
      description: "Spearman rank correlation: BioMate predicted rank vs experimental ΔG"
      target: 0.65
      comparison: "AutoDock Vina standalone: ~0.45"
    - name: pipeline_completion_rate
      description: "% of 15 systems completed end-to-end without error"
      target: 1.0
    - name: admet_accuracy
      description: "% PharmaBench ADMET classifications correct"
      target: 0.80
    - name: audit_coverage
      description: "% pipeline decisions with GOLD/SILVER/BRONZE evidence"
      target: 1.0
    - name: cost_per_pipeline
      description: "Total USD via Lago billing per complete pipeline run"
      target: null  # report only
