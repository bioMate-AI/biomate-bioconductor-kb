# Drug Discovery E2E Benchmark — 15 PDBbind Protein-Ligand Systems
#
# Tests BioMate's full drug discovery pipeline:
#   AlphaFold-DB search → docking → GROMACS MD → ADMET (PharmaBench) → ranked report
#
# Selection criteria:
#   - Experimental ΔG binding available (from PDBbind 2020 general set)
#   - Crystal structure in PDB (for validation)
#   - Multiple ligands per target (to test rank order, not just single prediction)
#   - Diverse target classes across drug modalities
#   - All ligands are drug-like (Lipinski compliant) and publicly available SMILES
#
# Scoring:
#   Spearman ρ: BioMate predicted rank vs experimental ΔG rank (target ≥ 0.65)
#   Pipeline completion: % of 15 systems completed end-to-end (target 100%)
#   ADMET accuracy: % PharmaBench classifications correct (target ≥ 80%)
#   Audit coverage: % decisions with GOLD/SILVER/BRONZE evidence (target 100%)
#
# Comparison: Mozi (PharmaBench orchestration accuracy from arXiv:2603.03655)
#             AutoDock Vina standalone (docking Spearman ρ typically ~0.45)

