# IND Gold Standard Reference Compounds
# All values from peer-reviewed literature or regulatory databases
# Sources cited per compound

version: "2.0"
updated: "2026-04-29"

compounds:
  # ─── Original 4 (v1.0) ───────────────────────────────────────────────────
  - id: Ibuprofen
    smiles: "CC(C)Cc1ccc(cc1)C(C)C(=O)O"
    mw_da: 206.3
    logp: 3.97
    role: lead_all_clear
    assays:
      hERG_IC50_uM: 32.0      # safe; Redfern 2003 Cat-4
      Ames_result: 0          # negative; Hansen 2009
      DILI_result: 0          # no concern; DILIrank nMDILI
    pk:
      fu_plasma: 0.01         # 1% unbound; Rainsford 2009 Inflammopharmacol
      vd_lkg: 0.15            # FDA label
      cl_hepatic_fraction: 0.90
      cl_renal_fraction: 0.05
      bioavailability_pct: 87  # FDA label
      t_half_h: 2.0           # FDA label
    sources:
      hERG: "Redfern WS et al. Cardiovasc Res 2003;58(1):32-45"
      Ames: "Hansen T et al. Chem Res Toxicol 2009;22(12):2058"
      DILI: "Chen M et al. Drug Discov Today 2016;21(4):648-653 (DILIrank)"
      PK: "FDA label; Rainsford KD. Inflammopharmacol 2009;17(6):275"
    expected:
      safety_flags: []
      rank: 1
      section_checks:
        - "hERG-flagged.*0"
        - "Ames-flagged.*0"

  - id: Terfenadine
    smiles: "OC(CCN1CCC(CC1)C(c1ccccc1)c1ccccc1)CCc1ccc(cc1)C(C)(C)C"
    mw_da: 471.7
    logp: 6.49
    role: hERG_positive_control
    market_status: withdrawn_1998  # FDA withdrew 1998 due to TdP/QT prolongation
    assays:
      hERG_IC50_uM: 0.10      # Redfern 2003 Category 1 (highest risk)
      Ames_result: 0          # negative
      DILI_result: 1          # DILIrank wMDILI
    sources:
      hERG: "Redfern WS et al. Cardiovasc Res 2003;58(1):32-45 Table 1"
      DILI: "DILIrank wMDILI class"
    expected:
      safety_flags: [hERG, DILI]
      note: "Canonical hERG positive control; withdrawn for QT prolongation/TdP"

  - id: Nitrofurantoin
    smiles: "O=C(/C=N/N1C(=O)NC(=O)C1=O)c1ccc([N+](=O)[O-])o1"
    mw_da: 238.2
    logp: -0.47
    role: ames_positive_control
    assays:
      hERG_IC50_uM: 120.0     # safe (>100 µM threshold)
      Ames_result: 1          # POSITIVE; Salmonella TA100 with S9
      DILI_result: 0          # DILIrank nMDILI (antibiotic, expected)
    sources:
      hERG: "Redfern 2003 Cat-4 (safe)"
      Ames: "Hansen T et al. Chem Res Toxicol 2009 — TA100+S9 positive"
    expected:
      safety_flags: [Ames]
      note: "Standard Ames positive control in ICH S2(R1) validation sets"

  - id: Atorvastatin
    smiles: "CC(C)c1nc(c(c(c1/C=C/[C@@H](O)CC(O)=O)c1ccc(F)cc1)C(=O)Nc1ccccc1)N1CCCCC1=O"
    mw_da: 558.7
    logp: 4.46
    role: dili_herg_borderline
    assays:
      hERG_IC50_uM: 5.2       # borderline; Redfern 2003 Cat-2/3
      Ames_result: 0          # negative
      DILI_result: 1          # DILIrank wMDILI (statin hepatotoxicity)
    pk:
      fu_plasma: 0.012        # FDA label (very high binding ~98.8%)
      bioavailability_pct: 14 # FDA label (low due to first-pass)
      t_half_h: 14            # FDA label
    sources:
      hERG: "Redfern 2003 Cat-2 (IC50 5.2 µM)"
      DILI: "DILIrank wMDILI"
    expected:
      safety_flags: [hERG, DILI]

  # ─── Extended Set (v2.0) ─────────────────────────────────────────────────

  - id: Cisapride
    smiles: "CCOC(=O)Nc1cc(Cl)ccc1OCC1CCN(CCCOC2=CC=CO2)CC1"
    mw_da: 465.9
    logp: 3.06
    role: hERG_strong_positive
    market_status: withdrawn_2000  # FDA withdrew due to fatal arrhythmias
    assays:
      hERG_IC50_uM: 0.014     # Category 1; strongest blocker in Redfern set
      Ames_result: 0
      DILI_result: 1          # DILIrank wMDILI
    sources:
      hERG: "Redfern 2003 Table 1: IC50 0.014 µM, 25 TdP reports, Cat-1"
    expected:
      safety_flags: [hERG, DILI]
      note: "Strongest hERG blocker in Redfern reference set. 0/10 TdP margin."

  - id: Troglitazone
    smiles: "CC1=C(C(=O)c2ccc(CC3SC(=O)NC3=O)cc2)C(C)(C)Oc2cc(OC)ccc21"
    mw_da: 441.5
    logp: 4.23
    role: dili_withdrawn_severe
    market_status: withdrawn_2000  # FDA withdrew 2000 for hepatic failure/death
    assays:
      hERG_IC50_uM: 90.0      # hERG safe
      Ames_result: 0
      DILI_result: 1          # DILIrank vMDILI (most severe class)
    sources:
      DILI: "DILIrank vMDILI class; >100 cases of liver failure/death (FDA 2000)"
    expected:
      safety_flags: [DILI]
      note: "Canonical vMDILI compound. Withdrawn for irreversible hepatotoxicity."

  - id: Warfarin
    smiles: "OC(=O)c1ccccc1OCC(=O)c1ccccc1"
    mw_da: 308.3
    logp: 2.70
    role: ppb_highly_bound
    assays:
      hERG_IC50_uM: 50.0      # Redfern Cat-3 (borderline safe)
      Ames_result: 0
      DILI_result: 0
    pk:
      fu_plasma: 0.005        # 99.5% bound; FDA label; TDC PPBR_AZ reference
      ppbr_pct: 99.5          # directly measurable; very high binding
      vd_lkg: 0.14            # FDA label
      t_half_h: 40.0          # FDA label (mean)
      bioavailability_pct: 97  # oral F% FDA label
    sources:
      PK: "FDA label (warfarin sodium); TDC PPBR_AZ dataset"
    expected:
      safety_flags: []
      pk_checks:
        fu_plasma_range: [0.003, 0.008]
      note: "Extreme PPB reference: fu=0.5%. Tests PPBR model at lower bound."

  - id: Midazolam
    smiles: "Clc1ccc2c(c1)C(c1ccccc1F)=NC=C2C"
    mw_da: 325.8
    logp: 3.89
    role: pbpk_cyp3a4_probe
    assays:
      hERG_IC50_uM: 0.30      # Redfern Cat-1; watch for hERG flag
      Ames_result: 0
      DILI_result: 0
    pk:
      fu_plasma: 0.035        # 96.5% bound; FDA label
      vd_lkg: 1.1             # FDA label (L/kg)
      cl_hepatic_fraction: 0.98  # almost entirely hepatic
      cl_renal_fraction: 0.01
      bioavailability_pct: 44  # oral; Varma 2015 dataset
      t_half_h: 1.8           # IV t½; FDA label
      cl_h_mL_min_kg: 21.4   # Obach 2008 measured CLh
    sources:
      hERG: "Redfern 2003 Cat-1 (IC50 0.30 µM)"
      PK: "FDA label; Obach RS. Drug Metab Dispos 2008;36(7):1357 (CLh=21.4)"
      OSP: "OSP PBPK Qualification Library — Midazolam (github.com/Open-Systems-Pharmacology)"
    expected:
      safety_flags: [hERG]
      note: "CYP3A4 index substrate. hERG IC50=0.30µM triggers flag — known cardiac monitoring risk."

  - id: Dofetilide
    smiles: "CS(=O)(=O)Nc1ccc(CCOCCCc2ccc(NS(C)(=O)=O)cc2)cc1"
    mw_da: 441.6
    logp: 1.28
    role: herg_class_iii_antiarrhythmic
    assays:
      hERG_IC50_uM: 0.005     # strongest in ICH S7B reference set (IC50=5 nM)
      Ames_result: 0
      DILI_result: 0
    sources:
      hERG: "Redfern 2003 Cat-1; ICH S7B reference compound for in vitro IKr"
    expected:
      safety_flags: [hERG]
      note: "ICH S7B mandated reference compound for hERG assay qualification. Intentional IKr blocker."
      clinical_note: "Used clinically with strict REMS (QTc monitoring); demonstrates gate should not exclude known antiarrhythmics"

  - id: Caffeine
    smiles: "Cn1cnc2c1c(=O)n(c(=O)n2C)C"
    mw_da: 194.2
    logp: -0.07
    role: low_ppb_negative_control
    assays:
      hERG_IC50_uM: 999.0     # essentially inactive
