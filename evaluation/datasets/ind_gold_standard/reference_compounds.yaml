      vd_lkg: 0.6             # FDA/literature
      t_half_h: 5.0           # adult; FDA
      bioavailability_pct: 100 # oral
    sources:
      PK: "TDC PPBR_AZ dataset; FDA GRAS database"
    expected:
      safety_flags: []
      pk_checks:
        fu_plasma_range: [0.50, 0.80]
      note: "Low PPB negative control (35% bound). Tests PPBR model at upper fu end."

