# Lane-arbitration eval — INSTANT-labeled cases.
#
# The Cloud-labeled half of this benchmark is the 200 runnable tasks in
# ../cross_domain_routing/queries.yaml (every one has a correct_workflow, so it
# should route to the Cloud lane). This file is the INSTANT half: genuine
# knowledge questions, ad-hoc file calculations, and — most importantly —
# ADVERSARIAL pairs whose Cloud twin lives in the routing set. These guard the
# real regression risk of the catalog-resonance change: over-promising Cloud on
# a question that merely *mentions* a runnable topic ("what is hERG?" resonates
# with hERG workflows but wants an answer, not a run).
#
# label: instant  (expected lane)
# category: evidence | definition | mechanism | comparison | recommendation |
#           internal | patent | adhoc_compute | adversarial_question

- id: q_def_001
  query: "What is hERG and why does it matter for drug safety?"
  category: adversarial_question
  confusable_with: "screen these SMILES for hERG liabilities and rank them"
- id: q_def_002
