# License-Gated Orchestration Benchmark — 30 Test Cases
#
# Tests correct tool routing under 3 credential scenarios.
# No competitor has this capability; 0 silent failures is the target.
#
# Scenarios:
#   A: full_licenses    — Schrödinger + MOE + Amber all available
#   B: no_licenses      — only open-source tools available
#   C: partial_licenses — Schrödinger only (MOE + Amber absent)
#
# Fields:
#   id:                    unique identifier
#   query:                 user query text
#   domain:                drug_discovery | structure_prediction | cryo_em
#   required_tools:        tools needed to fulfill the request
#   scenario_a:            correct behavior when all licenses available
#   scenario_b:            correct behavior with no licenses
#   scenario_c:            correct behavior with partial licenses
#   scenario_b_fallback_quality: GOOD | ACCEPTABLE | POOR (scientific appropriateness)
#   silent_failure_risk:   HIGH | MEDIUM | LOW (risk of silently attempting unavailable tool)
#
# Scoring (per test case):
#   correct_routing:       1.0 if tool selected matches scenario's expected tool
#   no_silent_failure:     1.0 if system never attempted an unavailable tool
#   fallback_quality:      1.0 (GOOD) | 0.5 (ACCEPTABLE) | 0.0 (POOR)
#   explanation_provided:  1.0 if user was clearly told what's blocked and why

# =========================================================
# MOLECULAR DOCKING (10 test cases)
# =========================================================

- id: lic_dock_001
  query: "Dock my lead compound SMILES CC1=CC=CC=C1NC against CDK2 PDB 1HCL using XP precision"
  domain: drug_docking
  required_tools: [schrodinger_glide]
  scenario_a:
    correct_tool: schrodinger_glide_docking
    mode: XP
    explanation_needed: false
  scenario_b:
    correct_tool: autodock_vina
    fallback_explanation: "Schrödinger Glide unavailable — using AutoDock Vina (free, validated)"
    explanation_needed: true
  scenario_c:
    correct_tool: schrodinger_glide_docking
    mode: XP
    explanation_needed: false
  scenario_b_fallback_quality: GOOD
  silent_failure_risk: HIGH
  notes: "Schrödinger is the primary tool; AutoDock Vina is a well-validated fallback"

