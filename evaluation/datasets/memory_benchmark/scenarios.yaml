# ===========================================================================
# DRUG-DEVELOPMENT DECISION EPISODES (MB-DD*) — added 2026-10-22
#
# Rationale: the original 20 scenarios test workflow-routing memory. These 12
# test the memory failures that actually bite a drug-dev PROGRAM — carrying a
# project-specific VALUE, ENTITY, prior FAILURE, or SUPERSEDED result across
# sessions. Design discipline:
#   - Every seeded value is NON-GUESSABLE (not a default, not inferable from
#     priors) so a correct recall PROVES memory, not pretraining. This is the
#     implicit memory-OFF ablation: without the episode the model cannot know
#     e.g. "this program gates hERG at 7.5 µM".
#   - Mapped onto the EXISTING scorer types only (recall / correction /
#     adversarial / baseline) → zero adapter change, published-baseline
#     weighting (A/B/C/T/S/X) preserved. Mapping:
#       value-carryover, entity-persistence, failure-lesson  → recall
#       generic-bad-option avoidance                         → adversarial (forbidden-absent)
#       tool correction                                      → correction
#       value supersession / staleness arbitration           → correction
#         (expected_workflow = NEW value term, disqualified_workflow = STALE
#          value term → scores 1.0 only if new present AND stale absent)
# ===========================================================================

- id: MB-DD1
  type: recall
  domain: drug_discovery
  difficulty: medium
  description: "Value carryover: program-specific hERG gate = 7.5 µM (non-default)"
