# Parameter Pre-filling Benchmark
# Tests BioMate's ability to infer workflow parameters from user intent
# via _infer_params_from_intent_llm() in ai_assistant.py.
#
# Scoring:
#   expected_params — keys BioMate MUST fill with semantically equivalent values
#   must_not_fill   — keys BioMate MUST NOT hallucinate (no organism/context)
#
# Difficulty: easy | medium | hard
---
cases:

  # ── Category 1: genome_inference (20 cases) ─────────────────────────────

  - id: pf_001
    category: genome_inference
    workflow: nf-core/rnaseq
    user_query: "RNA-seq differential expression on human lung adenocarcinoma samples"
    expected_params:
      genome: GRCh38
    must_not_fill:
      - accession
      - input
    difficulty: easy
    notes: "Human = GRCh38, no ambiguity"

