  # ── Category 8: param_name_disambiguation (15 cases) ───────────────────
  # Tests whether BioMate maps colloquial/abbreviated/informal parameter names
  # to the exact schema field names expected by the workflow.
  # Failure mode: user says "particle diameter 130Å" but LLM fills
