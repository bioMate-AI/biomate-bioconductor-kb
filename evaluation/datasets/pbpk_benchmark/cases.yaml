metadata:
  version: "1.0"
  fold_accuracy_target: 0.70  # fraction within 2-fold
  sources:
    - "FDA drug labels"
    - "Wishart 2006 DrugBank"
    - "Rodgers 2007 Clin Pharmacokinet"
  description: >
    15 reference compounds with published human PK from FDA drug labels and
    peer-reviewed literature. Each case provides physicochemical inputs
    (MW, logP, pKa, fu_plasma, CLint, renal_CL) to the PBPK simulation workflow
    and validates predicted Cmax/AUC/t_half against published values.
  correct_workflows:
    - pbpk_simulation
    - physiologically_based_pharmacokinetic
    - pbpk
  workflow_path: "nextflow_nfcore/subworkflows/drug_discovery/pbpk_simulation/main.nf"

cases:
  - id: PK-001
    name: Aspirin
    smiles: "CC(=O)Oc1ccccc1C(=O)O"
    dose_mg: 500
    route: oral
    inputs:
      MW: 180.16
      logP: 1.19
      pKa: 3.5
      fu_plasma: 0.50
      CLint_uL_min_mg: 180
      renal_CL_mL_min: 5
      OATP1B1_substrate: false
      Pgp_substrate: false
    reference:
      Cmax_uM: 0.54
      AUC_uM_h: 0.21
      t_half_h: 0.33
      Tmax_h: 0.5
    difficulty: easy

