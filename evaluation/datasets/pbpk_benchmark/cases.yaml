nl_query_templates:
  - type: complete_with_params
    template: "Run PBPK simulation for {name} ({smiles}): dose {dose_mg}mg {route}, MW={MW}, logP={logP}, pKa={pKa}, fu_plasma={fu_plasma}, CLint={CLint_uL_min_mg} uL/min/mg, renal_CL={renal_CL_mL_min} mL/min"
    expect_routing: true
    description: "Full query with all physicochemical params — should route to pbpk_simulation"

  - type: incomplete_no_smiles
    template: "Predict the human pharmacokinetics of my compound at 100mg oral dose. MW=350, logP=2.5"
    expect_prereq_ask: true
    description: "Missing SMILES — BioMate should ask for structure"

  - type: incomplete_no_params
    template: "Run PBPK for {smiles}"
    expect_prereq_ask: true
    description: "Has SMILES but missing clearance/binding params — should ask for CLint, fu_plasma"
