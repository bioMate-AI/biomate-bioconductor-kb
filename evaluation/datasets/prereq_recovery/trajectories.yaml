# Prereq Recovery Benchmark — 40 Multi-Turn Dialogue Trajectories
#
# Tests BioMate's ability to detect missing prerequisites, ask for them exactly once,
# and successfully launch the correct workflow after the user provides them.
#
# Fields:
#   id:                trajectory identifier
#   domain:            rna_seq | variant_calling | drug_docking | proteomics
#   turns:             list of {role: user|assistant_expected, text, attachment_type?}
#   expected_outcome:  RESOLVED | UNRESOLVED | LOOP | FALSE_LAUNCH
#   max_turns_allowed: number of turns before outcome is considered "slow"
#   correct_workflow:  the workflow that should be launched after recovery
#   missing_prereq:    what was initially missing
#   recovery_type:     wrong_format | missing_accession | missing_file | ambiguous_reference
#
# Scoring:
#   RESOLVED in <= max_turns_allowed:  1.0
#   RESOLVED in > max_turns_allowed:   0.5
#   UNRESOLVED:                        0.0
#   LOOP (asked same thing twice):     0.0
#   FALSE_LAUNCH (wrong data used):   -0.5

# =========================================================
# DOMAIN 1: RNA-SEQ (10 trajectories)
# =========================================================

- id: rna_rec_001
  domain: rna_seq
  missing_prereq: "no input files or accessions provided"
  recovery_type: missing_accession
  max_turns_allowed: 3
  correct_workflow: nf-core/rnaseq
  expected_outcome: RESOLVED
  turns:
    - role: user
      text: "Run differential expression analysis on my lung cancer RNA-seq data"
    - role: user
      text: "Here is my data"
      attachment_type: pdf_file
      attachment_note: "user attaches a PDF paper, not a FASTQ"
    - role: user
      text: "SRR8562951,SRR8562952,SRR8562953,SRR8562954"
      attachment_note: "correct SRR accessions provided"

