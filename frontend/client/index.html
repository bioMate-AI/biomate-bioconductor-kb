    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Analytics 4 — static loader so Tag Assistant / Google's
         "Tag Detected" check sees a literal <script src="…googletagmanager…">.
         The loader by itself does NOT send any hits; only gtag('config', …)
         dispatches the initial page_view. We pick which property to config
         at runtime by hostname so prod vs dev traffic stays separated, and
         localhost / E2E hosts call neither (zero noise). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-65JDDPEDQ5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      (function() {
        var host = window.location.hostname;
        if (host === 'biomate.ai' || host === 'www.biomate.ai') {
          gtag('config', 'G-65JDDPEDQ5', { anonymize_ip: true });
        } else if (host === 'dev-public.biomate.ai' || host.indexOf('.dev-public.biomate.ai') !== -1) {
          gtag('config', 'G-8YG54DFHQG', { anonymize_ip: true });
        }
        // localhost / 127.0.0.1 / playwright → no config call → no hits
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
