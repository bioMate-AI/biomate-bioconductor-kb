<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioMate Learning Series · review</title>
<style>
:root{--ink:#152333;--muted:#5c6b77;--blue:#245a91;--line:#d8e2e9;--paper:#fbfcfd}*{box-sizing:border-box}body{margin:0;background:#e4e9ed;font-family:"IBM Plex Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink)}#stage{width:1920px;height:1080px;background:var(--paper);position:relative;overflow:hidden;transform-origin:top left}.rail{height:90px;margin:0 80px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:22px;letter-spacing:.1em}.brand{font-size:32px;font-weight:650;letter-spacing:.01em}.brand i{display:inline-block;width:12px;height:12px;background:var(--blue);border-radius:50%;margin-right:16px}.review{font-size:19px;color:#866325;letter-spacing:.07em}.content{padding:56px 80px 72px;height:900px}.eyebrow{font-size:22px;color:var(--blue);letter-spacing:.1em;margin-bottom:20px}h1{font-weight:600;font-size:64px;line-height:1.35;letter-spacing:-.035em;margin:0;max-width:1500px}.subtitle{font-size:30px;line-height:1.55;color:var(--muted);max-width:1530px;margin:22px 0 38px}.body{display:flex;gap:36px;align-items:stretch;height:480px}.cards{display:flex;gap:22px;align-items:stretch;width:100%}.card{position:relative;flex:1;padding:42px 34px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;justify-content:center}.card .num{font-family:monospace;font-size:22px;color:var(--blue);margin-bottom:34px}.card .label{font-size:34px;line-height:1.45;font-weight:500}.card .value{font-size:76px;font-weight:500;color:var(--blue);font-variant-numeric:tabular-nums;margin-top:32px}.diagram .cards{align-items:center}.diagram .card{height:250px;padding:30px 22px}.diagram .label{font-size:28px}.diagram .card:not(:last-child):after{content:'→';position:absolute;right:-22px;top:102px;color:var(--blue);font-size:30px;z-index:2}.product .content{display:grid;grid-template-columns:850px 1fr;column-gap:80px;padding-top:38px;height:900px}.product .copy{padding-top:24px}.product h1{font-size:60px;max-width:780px}.product .subtitle{font-size:28px;margin-bottom:26px}.product .cards{flex-direction:column;gap:14px}.product .card{padding:20px 26px;flex-direction:row;justify-content:flex-start;gap:20px;align-items:center;border-radius:12px}.product .card .num{font-size:21px;margin:0}.product .card .label{font-size:26px}.screen{height:830px;border:1px solid var(--line);border-radius:14px;background:white;padding:8px;box-shadow:0 14px 35px #253b5012;display:flex;justify-content:center}.screen img{height:100%;max-width:100%;object-fit:contain}.screen-note{font-size:19px;color:var(--muted);margin-top:12px}.footer{position:absolute;left:80px;right:80px;bottom:28px;border-top:1px solid var(--line);padding-top:19px;display:flex;justify-content:space-between;font-size:19px;color:var(--muted)}.progress{height:4px;background:var(--blue);position:absolute;bottom:0;left:0}.card{animation:enter .6s both}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}.card:nth-child(4){animation-delay:.36s}.card:nth-child(5){animation-delay:.48s}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style></head><body><main id="stage"></main><script>
const params=new URLSearchParams(location.search);const lang=params.get('lang')==='zh'?'zh':'en';document.documentElement.lang=lang==='zh'?'zh-CN':'en';let index=Number(params.get('scene')||0);let data;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.renderScene=async function(n){index=n;const s=data.scenes[n],t=s[lang],stage=document.getElementById('stage');stage.className=s.kind;
const cards='<div class="cards">'+t.items.map((item,i)=>{const [label,value]=item.split('|');return `<div class="card"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="label">${esc(label)}</div>${value?'<div class="value">'+esc(value)+'</div>':''}</div>`}).join('')+'</div>';
const title=`<div class="eyebrow">${lang==='zh'?'研究教程':'RESEARCH TUTORIAL'} / ${s.kind==='product'?(lang==='zh'?'真实运行界面':'REAL RUN INTERFACE'):(lang==='zh'?'概念与解读':'CONCEPT & INTERPRETATION')}</div><h1>${esc(t.title)}</h1><p class="subtitle">${esc(t.subtitle)}</p>`;
stage.innerHTML=`<div class="rail"><span class="brand"><i></i>BioMate</span><span>${lang==='zh'?'BioMate 学习系列':'BIOMATE LEARNING SERIES'}</span><span class="review">${lang==='zh'?'内部审阅稿 · 尚未发布':'INTERNAL REVIEW · NOT RELEASED'}</span></div><div class="content">${s.image?'<div class="copy">'+title+cards+'<p class="screen-note">'+(lang==='zh'?'实际英文界面 · 中文讲解':'Actual BioMate development interface')+'</p></div><div class="screen"><img alt="BioMate run '+s.image+'" src="../../../../docs/qa/20261003-tutorial-release/'+s.image+'"></div>':title+'<div class="body">'+cards+'</div>'}</div><div class="footer"><span>${lang==='zh'?'真实运行示例 · 请核查证据与限制':'REAL RUN EXAMPLE · REVIEW THE EVIDENCE AND LIMITATIONS'}</span><span>03 OCT 2026 &nbsp; / &nbsp; ${String(n+1).padStart(2,'0')} — ${String(data.scenes.length).padStart(2,'0')}</span></div><div class="progress" style="width:${(n+1)/data.scenes.length*100}%"></div>`;
await Promise.all([...stage.querySelectorAll('img')].map(img=>img.decode()));return n;};
function resize(){document.getElementById('stage').style.transform=`scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;}window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')renderScene(Math.min(index+1,data.scenes.length-1));if(e.key==='ArrowLeft')renderScene(Math.max(0,index-1));});
fetch('episodes/'+encodeURIComponent(params.get('episode')||'result-downloads')+'/storyboard.json').then(r=>r.json()).then(async j=>{data=j;await renderScene(index);resize();window.__ready=true;});
</script></body></html>
