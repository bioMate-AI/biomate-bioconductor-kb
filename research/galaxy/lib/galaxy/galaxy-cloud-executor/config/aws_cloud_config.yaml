# AWS Cloud Executor Configuration
#
# 配置说明：
# 1. 将此文件复制到你的工作目录
# 2. 修改必需的配置项（标记为 REQUIRED）
# 3. 设置 AWS 凭证（使用环境变量或 AWS CLI 配置）
# 4. 运行测试验证配置

# ========================================
# AWS Provider Configuration
# ========================================
cloud_providers:
  aws:
    enabled: true
    region: "us-west-2"  # REQUIRED: AWS 区域 (updated to match your environment)

    # ----------------------------------------
    # AWS Credentials（认证配置）
    # ----------------------------------------
    # 使用 AWS SSO Profile（推荐方式）
    profile: "AdministratorAccess-399683337364"  # 您的 SSO profile 名称

    # 注意：使用SSO时，不需要设置以下字段：
    # access_key_id, secret_access_key, session_token
    # 这些会通过 aws sso login 自动获取

    # ----------------------------------------
    # AWS Batch Configuration（作业配置）
    # ----------------------------------------
    batch_queue: "galaxy-cloud-queue"  # REQUIRED: AWS Batch 作业队列名称
    batch_compute_environment: "galaxy-cloud-compute"  # 计算环境名称
    batch_job_definition: "galaxy-cloud-executor"  # 作业定义名称前缀

    # ----------------------------------------
    # S3 Storage Configuration（存储配置）
    # ----------------------------------------
    s3_bucket: "galaxy-cloud-data-1760241377"  # REQUIRED: S3 存储桶名称
    s3_prefix: "galaxy-cloud-executor"  # S3 key 前缀
    s3_storage_class: "STANDARD"  # STANDARD, INTELLIGENT_TIERING, STANDARD_IA

    # ----------------------------------------
    # Spot Instance Configuration（Spot 实例配置）
    # ----------------------------------------
    # Spot 实例比按需实例便宜 70-90%，但可能被中断
    spot_allocation: "spot"  # "spot" 或 "onDemand"
    max_spot_attempts: 3  # Spot 实例被中断时的重试次数

    # ----------------------------------------
    # Resource Limits（资源限制）
    # ----------------------------------------
    resource_limits:
      max_cpus: 64  # 单个作业最大 CPU 数
      max_memory_mb: 128000  # 单个作业最大内存 (MB)
      max_concurrent_jobs: 50  # 最大并发作业数

    # ----------------------------------------
    # IAM Roles（IAM 角色）
    # ----------------------------------------
    # Job Role: 作业容器运行时的权限（访问 S3, DynamoDB 等）
    job_role_arn: "arn:aws:iam::399683337364:role/BatchJobRole"

    # Service Role: AWS Batch 服务角色
    service_role_arn: "arn:aws:iam::399683337364:role/AWSBatchServiceRole"
    
    # Instance Profile: EC2 实例配置文件
    instance_profile_arn: "arn:aws:iam::399683337364:instance-profile/ecsInstanceRole"

    # ----------------------------------------
    # EFS Shared Storage（可选）
    # ----------------------------------------
    # 如果需要作业间共享数据，可以挂载 EFS
    # efs_mounts:
    #   - name: "galaxy-shared-data"
    #     file_system_id: "fs-12345678"  # EFS 文件系统 ID
    #     container_path: "/mnt/shared"
    #     root_directory: "/"
    #     read_only: false
    #     transit_encryption: "ENABLED"

# ========================================
# Storage Configuration（全局存储配置）
# ========================================
storage:
  aws:
    bucket_name: "galaxy-cloud-data-1760241377"  # 更新为实际存储桶名称
    region: "us-west-2"  # 更新为正确区域

# ========================================
# Execution Settings（执行配置）
# ========================================
execution:
  max_parallel_jobs: 5  # 最大并行作业数
  job_timeout: 3600  # 作业超时时间（秒）
  retry_attempts: 2  # 失败重试次数

  # 数据分区
  staging_area: "staging"  # 输入数据暂存区
  output_area: "outputs"  # 输出数据存储区
  temp_area: "tmp"  # 临时数据存储区

  # 默认资源配置
  default_resources:
    cpus: 1
    memory_mb: 2048
    disk_gb: 20

# ========================================
# Monitoring Configuration（监控配置）
# ========================================
monitoring:
  log_level: "info"  # debug, info, warning, error
  enable_metrics: true  # 启用指标收集

  # CloudWatch Logs
  cloudwatch_logs:
    enabled: true
    log_group: "/aws/batch/job"
    retention_days: 7  # 日志保留天数

# ========================================
# Global Settings（全局设置）
# ========================================
default_cloud_provider: "aws"
max_parallel_workflows: 10
workflow_timeout: 86400  # 24 小时
cleanup_on_completion: true  # 完成后清理临时数据
retain_intermediate_data: false  # 不保留中间数据

# ========================================
# Advanced Settings（高级设置）
# ========================================
advanced:
  # 自定义标签（所有资源）
  tags:
    Project: "Galaxy"
    ManagedBy: "GalaxyCloudExecutor"
    Environment: "production"

  # 自定义注解
  annotations:
    "galaxy.org/managed-by": "galaxy-cloud-executor"
    "galaxy.org/version": "1.0.0"

  # 全局环境变量（注入所有作业）
  global_env:
    GALAXY_CLOUD_EXECUTION: "true"
    TMPDIR: "/tmp"
    AWS_DEFAULT_REGION: "us-west-2"
    AWS_PROFILE: "AdministratorAccess-399683337364"
