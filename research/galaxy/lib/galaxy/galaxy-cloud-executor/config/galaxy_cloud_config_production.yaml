# Galaxy Cloud Executor - 生产环境配置
# 适用于服务级别的认证，无需用户交互

# ========================================
# AWS Provider Configuration - 生产模式
# ========================================
aws:
  enabled: true
  region: "us-west-2"
  
  # 认证配置 - 生产环境使用环境变量
  # 不使用 SSO profile，避免用户交互
  # 通过环境变量设置：
  # export AWS_ACCESS_KEY_ID="AKIA..."
  # export AWS_SECRET_ACCESS_KEY="xxx..."
  # 或者使用 AssumeRole (更安全)
  
  # 可选：AssumeRole 配置 (推荐)
  # role_arn: "${GALAXY_SERVICE_ROLE_ARN}"  # 从环境变量读取
  # role_session_name: "galaxy-cloud-service"
  # role_duration_seconds: 3600
  
  # Batch 配置
  batch_queue: "galaxy-cloud-queue"
  batch_compute_environment: "galaxy-cloud-compute"
  batch_job_definition: "galaxy-cloud-executor"
  
  # S3 配置
  s3_bucket: "galaxy-cloud-data-1760241377"
  s3_prefix: "galaxy-cloud-executor"
  s3_storage_class: "STANDARD"
  
  # EC2/Spot 配置
  instance_types:
    - "m5.large"
    - "m5.xlarge" 
    - "c5.large"
    - "c5.xlarge"
  spot_allocation: "spot"
  max_spot_attempts: 3
  
  # 资源限制
  resource_limits:
    max_cpus: 64
    max_memory_mb: 128000
    max_concurrent_jobs: 50
  
  # 重试配置 - 生产环境更保守
  retry_config:
    max_attempts: 5
    initial_delay: 2.0
    max_delay: 120.0
    exponential_base: 2.0
    jitter: 0.2

# ========================================
# 其他云提供商 (禁用)
# ========================================
azure:
  enabled: false

gcp:
  enabled: false

kubernetes:
  enabled: false

# ========================================
# 全局设置 - 生产环境优化
# ========================================
default_provider: "aws"
enable_auto_discovery: true
job_timeout_seconds: 7200  # 2小时，适合长时间作业
poll_interval_seconds: 60.0  # 降低轮询频率，减少API调用
cleanup_completed_jobs: true

# ========================================
# 安全配置 - 生产环境强化
# ========================================
security:
  enable_encryption: true
  enable_tls: true
  secret_backend: "env"  # 从环境变量读取密钥

# ========================================
# 监控配置 - 生产环境增强
# ========================================
monitoring:
  enable_metrics: true
  enable_tracing: true  # 生产环境启用链路追踪
  metrics_port: 8080
  log_level: "info"
  structured_logging: true
  prometheus_job: "galaxy-cloud-executor"
  jaeger_service_name: "galaxy-cloud-executor"