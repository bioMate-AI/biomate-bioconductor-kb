# Memory-recall eval set — 20 queries with expected canonical memory file.
#
# Each query is the kind of natural-language question a user might ask in
# the next conversation about prior work. The expected file is the memory
# file that should rank #1 in the candidate list shown to the LLM.
#
# Coverage: distributed across the categories the user actually has memory
# for (recent session, regulatory work, BixBench, cryo, billing, etc.).
#
# Score rules:
#   top1_hit  = expected file is at rank 1
#   top3_hit  = expected file in top-3

