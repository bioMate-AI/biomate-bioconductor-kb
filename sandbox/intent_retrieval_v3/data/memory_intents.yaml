# Memory recall intent anchors.
#
# Maps common user intents about session memory to specific memory-file
# canonical IDs (filenames relative to the auto-memory directory).
#
# Used by sandbox/intent_retrieval_v3/adapters/memory.py — when the user
# asks a question that obviously refers to known memory topics, the
# adapter promotes/injects the relevant memory file at the head of the
# candidate list so the LLM sees it first.
#
# Schema is the same as workflow_intent_anchors.yaml:
#   canonical: <file basename in the memory dir>
#   trigger_terms: [keywords / phrases that fire this intent]
#   disqualified_if_present: [terms that suppress this intent]
#
# Curation rule: only add an entry when the memory file is a "go-to" answer
# for the intent. If the LLM should consult multiple files, leave the user's
# fuzzy-search to do that work — the adapter is for unambiguous lookups.

# ─── Recent session output (this session) ────────────────────────────
current_retrieval_work:
  canonical: 20260519_SESSION_REVIEW_AND_DB_RETRIEVAL_GENERALIZATION.md
  trigger_terms:
    - what did we just build
    - this session's work
    - retrieval work summary
    - what we shipped today
    - session review
    - intent retrieval framework
  disqualified_if_present: []

