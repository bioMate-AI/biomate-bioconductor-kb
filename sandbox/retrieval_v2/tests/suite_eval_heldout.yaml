# Held-out suite eval — 30 queries about tool families NOT covered by
# tool_family_aliases.yaml or tool_family_canonical.yaml.
#
# Purpose: validate that family_dedup is SAFE on uncurated queries.
# When the YAML has no entry for a family, prioritize_query_family() should:
#   1. Return input unchanged (no reranking)
#   2. NOT introduce false positives (no wrong promotions)
#
# Treatment == baseline on every case here = library passes the held-out
# safety check.
#
# Coverage: high-traffic families from galaxy_ai_tools.db sandbox cluster
# analysis that have ≥ 5 wrappers but no canonical map entry.

