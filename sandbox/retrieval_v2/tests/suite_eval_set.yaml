# Hand-curated suite-level routing eval set.
#
# 30 queries → expected suite_id(s). Each query is the kind a biologist would
# type when picking a TOOL (not a full pipeline). Queries cover the
# top-10 BioMate domains plus a few adversarial cases.
#
# Scoring rules (run via run_suite_eval.py):
#   top1_hit   = any expected suite_id appears at rank 1
#   top3_hit   = any expected suite_id appears in top-3
#   top10_hit  = any expected suite_id appears in top-10
#   candidates = number of suites returned (lower is better at fixed accuracy)
#
# `expected` is a list — any one match counts. Use this for cases with
# legitimate alternatives (e.g. STAR or HISAT2 both valid for RNA-seq align).

- id: q01
  query: "Differential expression analysis of RNA-seq count data with DESeq2"
  expected: [deseq2]
  domain: rna_seq

- id: q02
