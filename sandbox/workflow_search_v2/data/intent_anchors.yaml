# Workflow Intent Anchors — Phase 1 (Lever 1 build)
#
# Curated query-intent → canonical workflow mappings. Used by
# sandbox/workflow_search_v2/library/workflow_intent.py:
#   prioritize_workflow_by_intent(query, candidates)
#
# Each entry:
#   canonical:                  workflow name to boost (must match what
#                               UnifiedWorkflowSearch returns)
#   trigger_terms:              substrings/keywords that indicate this intent
#                               (case-insensitive; multi-word phrases allowed)
#   pipeline_intent_required:   if true, also requires PIPELINE_VERBS in query
#   disqualified_if_present:    if any of these tokens appear, intent does NOT fire
#                               (use to prevent false matches: e.g. "single-cell" in
#                               an rnaseq query means scrnaseq instead)
#
# Coverage target: top 22 workflows by frequency in the 155-case benchmark
# (≥ 3 cases each). Covers ~84% of the dataset.

# ───────────────────────── RNA-seq family ──────────────────────────────
bulk_rnaseq:
  canonical: nf-core/rnaseq
  trigger_terms:
    - rna-seq
    - rnaseq
    - bulk rna
    - transcriptome quantification
    - fastq to counts
    - gene expression analysis
    - paired-end fastq
    - star align rna
    - rsem
    - salmon quant
  pipeline_intent_required: false  # rnaseq queries often skip pipeline verbs
  disqualified_if_present:
    - single-cell
    - single cell
    - 10x
    - cellranger
    - small rna
    - smrnaseq
    - micrornas
    - mirna
    - non-coding
    - long non-coding
    - lncrna
    - fusion gene
    - fusion transcripts
    - spatial transcriptomics
    - count matrix  # if user already has counts, → differentialabundance

single_cell_rnaseq:
  canonical: nf-core/scrnaseq
  trigger_terms:
    - single-cell rna
    - single cell rna
    - scrnaseq
    - scrna-seq
    - cell ranger
    - cellranger
    - starsolo
    - empty droplets
    - cell type identification
    - cluster cells
  pipeline_intent_required: false
  disqualified_if_present:
    - bd rhapsody
    - parse biosciences
    - split-seq
    - spatial
    - merfish
    - multiome
    - atac
    - cite-seq
    - antibody capture
    - chromium
    - tcr
    - t cell receptor
    - bcr
    - b cell receptor
    - clonotype
    - immune repertoire
    # NOTE: removed "doublet" — scrnaseq DOES do droplet/doublet QC,
    # over-tightening prevented sc_007 from flipping correctly

differential_abundance:
  canonical: nf-core/differentialabundance
  trigger_terms:
    - already have count matrix
    - have a count matrix
    - count matrix
    - differential expression
    - differential abundance
    - differentially expressed
    - deseq2 analysis
    - edger analysis
    - downstream differential
  pipeline_intent_required: false
  disqualified_if_present:
    - from fastq
    - align reads
    - single-cell
    - 10x
    - proteomics
    - metabolomics

small_rna:
